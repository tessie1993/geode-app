name: Android emulator
description: >-
  The emulator every device job boots: KVM for the runner, then an API 36 x86_64 emulator with the
  settings that survive the visualizer journeys on these runners, running the given script.
  Build the APKs first: built inside the emulator step, the native build shares the emulator's vCPUs.

inputs:
  script:
    description: The commands to run once the emulator is up (each line on its own; a failing line ends it).
    required: true
  profile:
    description: The hardware profile (avdmanager list device); empty is avdmanager's default device.
    default: ""
  phone:
    description: >-
      The phone whose screen size in dp the emulator takes: oppo-find-x9 (the owner's), pixel-9,
      compact-1080p (most Samsung and Xiaomi phones), budget-720p, tablet-10in, or avd-default
      (avdmanager's own 320x640 device).
    default: avd-default
  api-level:
    description: The Android API level of the system image (33 is minSdk, 36 targetSdk).
    default: "36"

runs:
  using: composite
  steps:
    # The emulator needs hardware acceleration to be usable; ubuntu runners
    # expose KVM but not to unprivileged processes by default.
    - name: Enable KVM for the emulator
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The phone's screen in dp at density 160, where a dp is one pixel: the same layout, breakpoints and
    # font scale as the phone, at a pixel count SwiftShader can draw. At the phone's own density the
    # 1256x2760 panel made every GL frame take seconds (frameMs=4400 at a 628x960 target, android.yml
    # run 45955255424) and starved the system UI as well.
    - name: Pick the screen
      id: screen
      shell: bash
      env:
        PHONE: ${{ inputs.phone }}
      run: |
        case "$PHONE" in
          oppo-find-x9)  dp=419x920  ;;  # 1256x2760 at 480 dpi
          pixel-9)       dp=411x923  ;;  # 1080x2424 at 420
          compact-1080p) dp=393x851  ;;  # 1080x2340 at 440, most Samsung and Xiaomi phones
          budget-720p)   dp=360x800  ;;  # 720x1600 at 320
          tablet-10in)   dp=800x1280 ;;  # 1600x2560 at 320
          avd-default)   echo "wm=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          *) echo "::error::unknown phone '$PHONE'"; exit 1 ;;
        esac
        echo "wm=adb shell wm size $dp && adb shell wm density 160" >> "$GITHUB_OUTPUT"

    - name: Run on the emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        # API 36 (Android 16, targetSdk) unless a run asks for another. Every level from minSdk 33 up
        # has READ_MEDIA_AUDIO and POST_NOTIFICATIONS, so permissions behave as on a real phone.
        api-level: ${{ inputs.api-level }}
        target: google_apis
        arch: x86_64
        profile: ${{ inputs.profile }}
        # The default 2 GB left the guest at ~75 MB free mid-suite. The journeys
        # pin Settings > Performance themselves (journey/Journeys.kt, Onboarded),
        # so the extra RAM does not change what the app renders.
        ram-size: 4096M
        heap-size: 576M
        # Three guest vCPUs: the fourth is left for the host side of
        # swiftshader, which renders every GL frame the app draws.
        cores: 3
        disk-size: 6000M
        force-avd-creation: true
        emulator-boot-timeout: 900
        # swangle_indirect (ANGLE on SwiftShader Vulkan), not swiftshader_indirect: under the
        # visualizer journeys the legacy translator died host-side with "DisplaySurfaceGlContextHelper
        # context was preempted by others ... Failed to restore previous context: 12297" and the
        # emulator dropped off adb after 27/33 tests (runs 41282308944, 41282326381, 41288443184).
        emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        disable-animations: true
        working-directory: .
        # No soft keyboard: a focused field raised Gboard, whose first draw on the shared SwiftShader core held
        # the app's next frame for 22-27 s, past Espresso's idling timeout (VisualsJourneyTest.savingTheCurrentLookAddsAPresetRow).
        # show_ime_with_hard_keyboard does nothing without a hardware keyboard, so every listed IME package is
        # disabled instead (the google_apis image ships Gboard, com.google.android.inputmethod.latin). Each line
        # runs on its own `sh -c`; a failure here leaves the keyboard on and the run going.
        script: |
          ${{ steps.screen.outputs.wm }}
          for p in $(adb shell ime list -s -a | cut -d/ -f1 | sort -u); do adb shell pm disable-user --user 0 "$p"; done || true
          adb shell ime list -s || true
          ${{ inputs.script }}
