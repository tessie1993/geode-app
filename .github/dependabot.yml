version: 2
updates:
  # The workflows, and the composite action they share (a `uses:` there is pinned like any other).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/android-build-setup"
    schedule:
      interval: "weekly"

  # The version catalog (gradle/libs.versions.toml) and the build scripts' plugins. Minor and
  # patch bumps come as one PR a week so CI runs once for them; a major bump comes on its own.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]

  # The native submodules under third_party/.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
