name: Instrumented tests (emulator)

# The two checks that run only by hand: the instrumented tests on an emulator, and the sound
# engine across frame rates on the owner's test tracks.
# Pull requests are gated by build-lint.yml, native-host-tests.yml and arch-map.yml.
# This workflow builds no APK to keep and ships nothing: a branch build is build-lint.yml's
# artifact, a pre-release is ship-apk.yml (Run workflow, with the ref).

on:
  workflow_dispatch:

permissions:
  contents: read

# A newer manual run on the same branch replaces the older one.
concurrency:
  group: geode-emulator-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Real music: the owner's test tracks live on the orphan branch claude/test-music, so the app's
  # history never carries the audio. Each must read the same at 30, 60 and 120 fps; the report
  # (tempo, key, scale, sections) is for an ear to judge, since the tracks carry no labels.
  # The synthetic song runs on every pull request (native-host-tests.yml, "Sound across frame rates").
  real-music:
    name: Real music across frame rates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # core/sound/Fft runs on KISS FFT; only that submodule, the others are large and unused here.
      - name: Check out the kissfft submodule
        run: git submodule update --init --depth 1 third_party/kissfft
      # The same line as the sound_rate_test entry of core/tests/host-tests.txt.
      - name: Build the test
        run: g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/sound_rate_test.cpp core/sound/*.cpp core/output/FrameClock.cpp -o sound_rate_test
      - name: Check out the test music
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/test-music
          path: test-music
      - name: Real music across frame rates
        run: |
          set -o pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          mkdir -p golden-out
          status=0
          for f in test-music/*.mp3; do
            ffmpeg -v error -i "$f" -f f32le -ac 2 -ar 44100 "${f%.mp3}.f32"
            ./sound_rate_test --pcm "${f%.mp3}.f32" 44100 | tee -a golden-out/music.txt || status=1
          done
          exit $status
      - name: Upload the real-music report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sound-music
          path: golden-out/music.txt
          if-no-files-found: warn
          retention-days: 14

  # Instrumented tests need a real Android runtime: MediaStore, a live
  # MediaSession and the permission model do not exist off a device, and
  # Robolectric's shadows actively misreport some of them (its ContentResolver
  # returns success for any uri, so a delete of a missing file "succeeds").
  # This job is the only place those paths are genuinely exercised.
  #
  # Manual: the emulator takes minutes to boot.
  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up the Android build
        uses: ./.github/actions/android-build-setup

      # The emulator needs hardware acceleration to be usable; ubuntu runners
      # expose KVM but not to unprivileged processes by default.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Both APKs before the emulator exists. Built inside the emulator step, the
      # ten-minute native build ran on the same four vCPUs as the booted emulator,
      # and the emulator only had to survive that to reach the first test.
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      # tools/connected-tests.sh runs the suite, keeps the device's full logcat
      # (events buffer included: am_anr, am_kill), ANR traces and tombstones, and
      # retries once only for an emulator failure (adb lost the device) or for
      # tests whose instrumentation process was killed; an assertion failure or a
      # native crash of the app is never retried. Runs 41178519245, 41181213744 and 41190866232 failed on
      # exactly those two signatures.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 36 (Android 16), the app's targetSdk: what new phones run. minSdk is 33,
          # so READ_MEDIA_AUDIO and POST_NOTIFICATIONS behave as on a real phone.
          api-level: 36
          target: google_apis
          arch: x86_64
          # The default 2 GB left the guest at ~75 MB free mid-suite. The journeys
          # pin Settings > Performance themselves (journey/Journeys.kt, Onboarded),
          # so the extra RAM does not change what the app renders.
          ram-size: 4096M
          heap-size: 576M
          # Three guest vCPUs: the fourth is left for the host side of
          # swiftshader, which renders every GL frame the app draws.
          cores: 3
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 900
          # swangle_indirect (ANGLE on SwiftShader Vulkan), not swiftshader_indirect: under the
          # visualizer journeys the legacy translator died host-side with "DisplaySurfaceGlContextHelper
          # context was preempted by others ... Failed to restore previous context: 12297" and the
          # emulator dropped off adb after 27/33 tests (runs 41282308944, 41282326381, 41288443184).
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put secure long_press_timeout 1500
            adb shell settings put secure show_ime_with_hard_keyboard 0
            adb shell input keyevent 82
            bash tools/connected-tests.sh
          working-directory: .

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-instrumented-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14
