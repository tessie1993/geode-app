name: Build MuzViz Debug APK

# Pull-request CI, plus a manual build when an APK is wanted from a branch.
# Pushes to main are handled by ship-apk.yml, which runs the same build and
# checks and then publishes the APK as a GitHub Release — running both on main
# would build the app twice per push for the same result.
# Pushes to claude/** work branches run it too, so agent sessions offload
# build, lint and tests here instead of building locally.
# A green run on a push (or a manual run) ends by shipping the next
# pre-release through ship-apk.yml; see the "pre-release" job at the end.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
  pull_request:
    paths:
      - "app/**"
      - "engine/**"
      - "core/**"
      - "CMakeLists.txt"
      - "tools/**"
      - "third_party/**"
      - ".gitmodules"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

# One build per commit. A push to a claude/** branch with an open PR fires both
# a push run and a pull_request run for the same commit; keying the group on the
# branch name (head_ref on a PR, ref_name on a push) puts them in one group, so the
# later one cancels the earlier and the commit builds once instead of twice. The
# check results attach to the commit either way, so the PR still shows them.
# The head repository is part of the key, so a fork's PR from a same-named
# branch never shares (and cancels) this repository's runs.
concurrency:
  group: geode-debug-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_DIR: .
  APK_SOURCE: app/build/outputs/apk/debug/app-debug.apk

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      # glslcheck (tools/glslcheck) renders one style headlessly: its include
      # resolution, uniform table and catalogue reading against the app's real
      # files. Nothing else runs it, so without this it broke silently once
      # (the allow-list moved and every render failed). One style, seconds,
      # before the slow steps. Node 22 for the global WebSocket cdp.mjs uses;
      # the runner's Chrome renders through SwiftShader.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: glslcheck one style
        working-directory: ${{ env.PROJECT_DIR }}/tools/glslcheck
        run: |
          export MUSICVIZ_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node check.mjs --shader neon_chrome_sea --size 128 --out out/neon_chrome_sea.png

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK 36, NDK and CMake
        shell: bash
        # sdkmanager is not on PATH on the ubuntu-24.04 runner image; resolve
        # it from the preinstalled SDK location instead. The NDK and CMake
        # versions match ndkVersion and externalNativeBuild.cmake.version in
        # app/build.gradle.kts: they compile the MilkDrop JNI bridge from
        # app/src/main/cpp during assembleDebug.
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      # Baselined static analysis: the SwallowedException/UnusedParameter
      # class of bug is caught at PR time instead of the next audit.
      - name: detekt
        working-directory: ${{ env.PROJECT_DIR }}
        # Every module, not just :app: build-logic applies detekt (and a per-module
        # baseline) to all four, but a gate CI never runs is not a gate. --continue
        # so one module's failure still produces the other modules' reports.
        run: ./gradlew :app:detekt :engine:audio-core:detekt :engine:scenes:detekt :engine:audio-android:detekt --continue --stacktrace --no-daemon

      # detekt prints only "Analysis failed with N weighted issues" and a stack
      # trace; the findings themselves go to a report file. Without this, reading
      # a failure means downloading the reports artifact, so the log says a gate
      # failed but never which rule or which line. Print them instead.
      - name: Show detekt findings
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for module in app engine/audio-core engine/scenes engine/audio-android; do
            dir=$module/build/reports/detekt
            if [ -f "$dir/detekt.txt" ]; then
              echo "::group::detekt findings ($module)"
              cat "$dir/detekt.txt"
              echo "::endgroup::"
            elif [ -f "$dir/detekt.xml" ]; then
              # The XML carries the same findings one <error> element per issue;
              # enough to name the rule, file and line without the artifact.
              echo "::group::detekt findings ($module, xml)"
              grep -oE '<file name="[^"]*"|<error line="[0-9]+" column="[0-9]+" severity="[^"]*" message="[^"]*" source="[^"]*"' "$dir/detekt.xml" || cat "$dir/detekt.xml"
              echo "::endgroup::"
            else
              echo "No detekt report found under $dir. Present:"
              ls -la "$dir" 2>/dev/null || echo "  (directory absent)"
            fi
          done

      # Seconds, not minutes: the pure render-thread math (reaction matrix,
      # camera rig) built with the runner's own compiler, and every fragment
      # style compiled by the NDK's glslc with its //#include lines resolved.
      # Both fail fast, before the 20-minute native build.
      - name: Native host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Icore -Icore/tests/stub             core/tests/viz_math_test.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/CameraRig.cpp core/viz/MotionField.cpp core/viz/Lfo.cpp core/viz/Macros.cpp             core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp -o viz_math_test
          ./viz_math_test
          # The fluid engine: multigrid pressure plan, MacCormack, splat batching, heat, tracers, tiers.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/fluid_math_test.cpp core/viz/fluid/FluidMath.cpp -o fluid_math_test
          ./fluid_math_test
          # Liquid mode's pure maths: thermal modes, inject weight, the random dive, gestures, born clock, drop flare.
          g++ -std=c++20 -O1 -Wall -Wextra -Icore -Icore/tests/stub core/tests/liquid_test.cpp core/viz/liquid/LiquidMath.cpp -o liquid_test
          ./liquid_test
          # Which built scenes stay on the GPU (#378): a bounded LRU with pins, spares by thermal tier, lazy resize.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/scene_residency_test.cpp -o scene_residency_test
          ./scene_residency_test
          # The program-binary cache's crash sentinel, shared by every renderer in the process (#381).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore core/tests/cache_sentinels_test.cpp -o cache_sentinels_test
          ./cache_sentinels_test
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/sound_test.cpp core/sound/*.cpp -o sound_test
          ./sound_test
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/musical_test.cpp core/sound/*.cpp -o musical_test
          ./musical_test
          # Every GeodeSoundFrame scalar per frame over a synthetic song, against core/tests/golden/; also
          # reports the 30/120 fps drift of the frame-clocked fields. Regenerate with --write on purpose.
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/sound_golden_test.cpp core/sound/*.cpp -o sound_golden_test
          ./sound_golden_test core/tests/golden/sound_frames.tsv
          # The auto-director: the emotion table, the live feeling and the director's decisions.
          g++ -std=c++20 -O1 -Wall -Wextra -Icore -Icore/tests/stub core/tests/director_test.cpp core/sound/*.cpp \
            core/viz/Director.cpp core/viz/Reactions.cpp core/viz/Lfo.cpp core/viz/Macros.cpp core/viz/CameraRig.cpp \
            core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp -o director_test
          ./director_test
          # Note & key reactions: knobs by meaning, the drum weight, hues per note, the tint, off = today.
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/note_response_test.cpp core/viz/NoteResponse.cpp -o note_response_test
          ./note_response_test
          # core/signal: the param state machine and store, the events, the bus and event routes (flash limit).
          # Built from core/signal alone: no GL, no core/viz.
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/signal_test.cpp core/signal/params/*.cpp \
            core/signal/events/*.cpp core/signal/bindings/*.cpp -o signal_test
          ./signal_test
          # The raw-PCM hand-off: each pushed block reaches the scenes once, so a paused pulse decays.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/pcm_handoff_test.cpp -o pcm_handoff_test
          ./pcm_handoff_test
          # An export segment's style schedule: every later style is gated by the entitlement (#357).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/style_schedule_test.cpp core/viz/StyleSchedule.cpp -o style_schedule_test
          ./style_schedule_test
          # The process-wide shader overrides every renderer draws (#364): set, replace, clear, generation, copies.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/shader_overrides_test.cpp core/viz/ShaderOverrides.cpp -o shader_overrides_test
          ./shader_overrides_test
          # The photosensitive flash limiter: a 10 Hz strobe shows at most 3 flashes/s, a slow fade passes untouched.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/flash_limiter_test.cpp core/viz/FlashLimiter.cpp -o flash_limiter_test
          ./flash_limiter_test
          # Voice "play X" over the library (#382): query, focus extras, blank = everything, no match = nothing.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/library_search_test.cpp core/library/Search.cpp core/api/geode_library_api.cpp -o library_search_test
          ./library_search_test
          # Envelopes and LFOs on luminance targets reach the flash limiter (#363): an 8 Hz envelope strobe holds within 0.25 s.
          g++ -std=c++20 -O1 -Wall -Wextra -Icore -Icore/tests/stub core/tests/luminance_drive_test.cpp core/viz/Adsr.cpp core/viz/Lfo.cpp \
            core/viz/FlashLimiter.cpp core/viz/VisualSafety.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp -o luminance_drive_test
          ./luminance_drive_test

      # The scene and style catalogue (core/viz/Catalogue): ids, families, param scopes, ranges, and
      # its text table byte-equal to core/tests/catalogue.txt, the copy the JVM tests read.
      - name: Catalogue host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/catalogue_test.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o catalogue_test
          ./catalogue_test core/tests/catalogue.txt
      # The export DSP (resampler, BS.1770 loudness meter), ported from Kotlin (ADR 0003), and the playback DSP's hand-off.
      - name: Native export DSP tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/resampler_test.cpp core/audio/dsp/PcmResampler.cpp core/audio/dsp/Loudness.cpp core/audio/dsp/PcmConvert.cpp core/api/geode_export_dsp_api.cpp -o resampler_test
          ./resampler_test
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/loudness_test.cpp core/audio/dsp/PcmResampler.cpp core/audio/dsp/Loudness.cpp core/audio/dsp/PcmConvert.cpp core/api/geode_export_dsp_api.cpp -o loudness_test
          ./loudness_test
          # The playback DSP's format hand-off (#356): the old format's tail drains through its own chain
          # until flush, and no block is ever processed past its buffer.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/dsp_handoff_test.cpp core/api/geode_dsp_api.cpp \
            core/audio/dsp/DspProcessor.cpp core/audio/dsp/Equalizer.cpp core/audio/dsp/Crossfeed.cpp core/audio/dsp/Limiter.cpp -o dsp_handoff_test
          ./dsp_handoff_test

      # Export planning and clip maths ported from Kotlin (ADR 0003, ADR 0006 core/output and
      # core/signal/timeline): frame clock, loops, encoder budget, chapters, keyframes, speed ramps,
      # clip grade, .cube LUTs, PCM conversion and timing, each through its C ABI too.
      - name: Native export planning tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          EXPORT_SRCS="core/api/geode_export_api.cpp core/output/FrameClock.cpp core/output/LoopPlan.cpp core/output/EncodePlan.cpp core/output/Chapters.cpp core/signal/timeline/Keyframes.cpp core/signal/timeline/SpeedRamp.cpp core/viz/ClipGrade.cpp core/util/CubeLut.cpp core/audio/dsp/PcmConvert.cpp core/audio/dsp/PcmTiming.cpp"
          for t in output_test timeline_test clip_media_test; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/$t.cpp $EXPORT_SRCS -o $t
            ./$t
          done

      # The Customize randomizer, Reset tab and params wire (core/viz/ParamRandomizer, core/viz/Params).
      - name: Params host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/params_test.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o params_test
          ./params_test

      # The Customize panel's ten categories, their sections and per-category roll and reset (core/viz/CustomizeMap).
      - name: Customize map host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Icore core/tests/customize_test.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o customize_test
          ./customize_test core/tests/customize.txt

      - name: Shader compile check
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/check_shaders.py "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/28.0.13004108/shader-tools/linux-x86_64/glslc"

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # The name the APK carries: <base>-dev-debug (only ship-apk.yml numbers builds).
          VERSION_NAME=$("${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2" dump badging "$APK_SOURCE" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          echo "versionName=$VERSION_NAME"
          SHORT_SHA="${GITHUB_SHA::7}"
          FILE_NAME="MuzViz-${VERSION_NAME:-debug}-${SHORT_SHA}-debug.apk"

          mkdir -p dist
          cp "$APK_SOURCE" "dist/$FILE_NAME"
          sha256sum "dist/$FILE_NAME" > "dist/$FILE_NAME.sha256"

          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Built dist/$FILE_NAME"

      # Convenience, not a gate: the APK is here so a reviewer can install the
      # build without running it themselves. It must never decide whether the
      # PR is green. Run 185 failed on "Artifact storage quota has been hit"
      # AFTER the APK had already been assembled, which skipped every
      # verification step below and reported the whole job as a failure - a
      # red check that said "the build is broken" when the build was fine and
      # nothing had been verified at all. continue-on-error keeps a full
      # artifact store (or a flaky upload) from speaking for the code.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: geode-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.file_name }}
            dist/${{ steps.package.outputs.file_name }}.sha256
          if-no-files-found: error
          # 7 days, not 30: the quota that broke run 185 is the sum of these.
          # The APK is mostly WebP and native libs, which do not compress
          # further, but the dex and resources.arsc do - so this no longer
          # forces compression off.
          retention-days: 7

      # Verification runs after the APK upload. If a check fails, the APK is
      # still available from the workflow run for device testing.
      # The promises Play and the privacy policy rest on, checked on every PR so a break
      # shows up here, not only when a release bundle is requested (release.yml). INTERNET is
      # for Cast to TV only (dev.geode.cast), so it may appear only with the Cast service; the
      # main manifest is the same for every build type, so the debug manifest is a fair proxy.
      # Cast to TV is the app's only internet use (owner, 2026-11-02). The manifest check below
      # can only see the permission, so this one looks at the code and the dependencies: no
      # socket or HTTP API outside dev.geode.cast, and no networking, analytics or ads SDK in
      # the release build.
      - name: Check that only Cast uses the internet
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          pattern='java\.net\.(Socket|ServerSocket|DatagramSocket|HttpURLConnection|URL)([^A-Za-z]|$)|\.openConnection\(|javax\.net\.ssl\.HttpsURLConnection'
          hits=$(grep -rnE "$pattern" app/src/main engine/*/src/main --include=*.kt --include=*.java             | grep -v '/dev/geode/cast/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Network APIs used outside dev.geode.cast; Cast to TV is the only internet use."; exit 1
          fi
          deps=$(./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q)
          # Firebase by product: Cast's own logging (datatransport) brings firebase-encoders, which only
          # serialises its anonymous log records and opens no connection (Data safety declares it).
          banned='okhttp|retrofit|ktor|cronet|volley|firebase-(analytics|crashlytics|messaging|perf|config|installations|auth|firestore|database|storage|appcheck|inappmessaging|dynamic-links|ml)|play-services-ads|play-services-measurement|play-services-analytics|crashlytics|sentry|appsflyer|adjust'
          if echo "$deps" | grep -iE "$banned"; then
            echo "::error::A networking, analytics or ads SDK is in the release build; Cast to TV is the only internet use."; exit 1
          fi

      - name: Check the merged manifest against the app's promises
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          manifest=$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml \
            -path '*merged_manifest*' | head -n 1)
          test -n "$manifest" || { echo "::error::merged debug manifest not found"; exit 1; }
          echo "Merged manifest: $manifest"
          if grep -q 'android.permission.INTERNET"' "$manifest" && ! grep -q 'dev.geode.cast.CastService' "$manifest"; then
            echo "::error::The merged manifest requests INTERNET without Cast; Cast to TV is the only internet use."; exit 1
          fi
          if grep -q 'com.google.android.gms.permission.AD_ID' "$manifest"; then
            echo "::error::The merged manifest carries AD_ID; the Advertising ID declaration says it is unused."; exit 1
          fi
          grep -q 'com.android.vending.BILLING' "$manifest" \
            || { echo "::error::Play Billing's BILLING permission is missing from the merged manifest"; exit 1; }
          target=$(sed -n 's/.*android:targetSdkVersion="\([0-9]*\)".*/\1/p' "$manifest" | head -n 1)
          echo "targetSdkVersion=$target"
          [ "${target:-0}" -ge 36 ] || { echo "::error::targetSdkVersion $target is below Play's requirement (36)"; exit 1; }

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:testDebugUnitTest :engine:audio-core:test :engine:scenes:testDebugUnitTest :engine:audio-android:testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Run Kotlin formatting checks
        working-directory: ${{ env.PROJECT_DIR }}
        # --continue so one module's failure still prints every other module's findings in the log.
        run: ./gradlew ktlintCheck --continue --stacktrace --no-daemon

      - name: Upload reports when verification fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: geode-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            engine/*/build/reports/
            engine/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Instrumented tests need a real Android runtime: MediaStore, a live
  # MediaSession and the permission model do not exist off a device, and
  # Robolectric's shadows actively misreport some of them (its ContentResolver
  # returns success for any uri, so a delete of a missing file "succeeds").
  # This job is the only place those paths are genuinely exercised.
  #
  # Its own job rather than a step in the build: the emulator takes minutes to
  # boot, and a slow device suite must not delay the APK the build job
  # publishes for manual testing.
  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable; ubuntu runners
      # expose KVM but not to unprivileged processes by default.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Both APKs before the emulator exists. Built inside the emulator step, the
      # ten-minute native build ran on the same four vCPUs as the booted emulator,
      # and the emulator only had to survive that to reach the first test.
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon

      # tools/connected-tests.sh runs the suite, keeps the device's full logcat
      # (events buffer included: am_anr, am_kill), ANR traces and tombstones, and
      # retries once only for an emulator failure (adb lost the device) or for
      # tests whose instrumentation process was killed; an assertion failure is
      # never retried. Runs 41178519245, 41181213744 and 41190866232 failed on
      # exactly those two signatures.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 29 is the floor for the scoped-storage paths these tests cover;
          # anything below skips them via assumeTrue rather than failing.
          api-level: 30
          target: google_apis
          arch: x86_64
          # The default 2 GB left the guest at ~75 MB free mid-suite. The journeys
          # pin Settings > Performance themselves (journey/Journeys.kt, Onboarded),
          # so the extra RAM does not change what the app renders.
          ram-size: 4096M
          heap-size: 576M
          # Three guest vCPUs: the fourth is left for the host side of
          # swiftshader, which renders every GL frame the app draws.
          cores: 3
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 900
          # swangle_indirect (ANGLE on SwiftShader Vulkan), not swiftshader_indirect: under the
          # visualizer journeys the legacy translator died host-side with "DisplaySurfaceGlContextHelper
          # context was preempted by others ... Failed to restore previous context: 12297" and the
          # emulator dropped off adb after 27/33 tests (runs 41282308944, 41282326381, 41288443184).
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put secure long_press_timeout 1500
            adb shell settings put secure show_ime_with_hard_keyboard 0
            adb shell input keyevent 82
            bash tools/connected-tests.sh
          working-directory: .

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geode-instrumented-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The visual quality gate (#470): every style glslcheck can render, through the sound engine's golden
  # song (core/tests/golden/sound_frames.tsv), judged by core/tests/visual_gate.cpp for mostly black
  # stills, blown highlights and flashes the FlashLimiter would hold. Thresholds: tools/glslcheck/README.md
  # ("Stills gate"); styles failing today: core/tests/visual_gate_baseline.txt. Four shards render in
  # parallel (SwiftShader is slow on the heavy marches); one job judges them all. Needs no submodules, no
  # SDK: Node 22, the runner's Chrome and g++.
  visual-stills:
    name: Visual stills (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render the stills
        working-directory: ${{ env.PROJECT_DIR }}/tools/glslcheck
        run: |
          export MUSICVIZ_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node check.mjs --stills out/stills-${{ matrix.shard }}.tsv --shard ${{ matrix.shard }}/4 --out out/stills

      - name: Upload the stills
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-stills-${{ matrix.shard }}
          path: |
            tools/glslcheck/out/stills-${{ matrix.shard }}.tsv
            tools/glslcheck/out/stills/
          if-no-files-found: warn
          retention-days: 14

  visual-gate:
    name: Visual gate
    needs: visual-stills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the stills
        uses: actions/download-artifact@v6
        with:
          pattern: visual-stills-*
          path: stills
          merge-multiple: true

      # The per-style report is the log; on a new failure it ends with the baseline lines to paste. The
      # still PNGs are in the visual-stills-* artifacts, to look at before baselining anything.
      - name: Judge the stills
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/visual_gate.cpp core/viz/FlashLimiter.cpp -o visual_gate
          ./visual_gate core/tests/visual_gate_baseline.txt stills/stills-*.tsv

  # The last step of every green run on a push or a manual run: ship this commit
  # as the next pre-release ("Geode <base>.N"), so each commit that passed the
  # build, lint, unit and emulator tests has an installable APK. Pull-request
  # runs skip it: the push run of the same commit ships it already, and a
  # fork's token cannot write releases. A newer push to the branch cancels this
  # run, and ship-apk.yml then hands its reserved number back.
  pre-release:
    name: Ship pre-release
    needs: [build-debug-apk, instrumented-tests, visual-gate]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/ship-apk.yml
    with:
      ref: ${{ github.sha }}
      prerelease: true
