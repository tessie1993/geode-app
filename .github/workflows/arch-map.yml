name: Architecture gates

# The layer rule, the engine Kotlin rule, the no-BPM-bias rule, the action pin rule and the notices copy. No path
# filter, so the check reports on every PR.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: arch-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-map:
    name: Architecture gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pins the layer gate the same way: a planted reverse dependency must fail it.
      - name: Self-test the layer gate
        shell: bash
        run: |
          set -u
          t=$(mktemp -d)
          mkdir -p "$t/app/src/main/java/dev/geode/ui" "$t/app/src/main/java/dev/geode/data" "$t/engine"
          echo 'import dev.geode.data.Store' > "$t/app/src/main/java/dev/geode/ui/Screen.kt"
          echo 'import dev.geode.ui.Screen' > "$t/app/src/main/java/dev/geode/ui/Other.kt"
          bash tools/layer-gate.sh "$t" >/dev/null || { echo "::error::layer gate self-test: clean tree failed"; exit 1; }
          echo 'val x = dev.geode.ui.Screen::class' > "$t/app/src/main/java/dev/geode/data/Store.kt"
          if bash tools/layer-gate.sh "$t" >/dev/null; then echo "::error::layer gate self-test: reverse dependency passed"; exit 1; fi
          echo "layer gate self-test passed"

      - name: Nothing below ui names ui
        shell: bash
        run: bash tools/layer-gate.sh

      # Pins the no-BPM-bias gate: each shape the tempo bias came back in, and a 120 used as a tempo anywhere
      # (tests included), must fail it; a test's other tempos, "no tempo yet", the detector's search limits and
      # a 120 that is no tempo (fps, Hz, frames) must pass.
      - name: Self-test the no-BPM-bias gate
        shell: bash
        run: |
          set -u
          t=$(mktemp -d)
          mkdir -p "$t/core/sound" "$t/core/viz" "$t/core/tests" "$t/app/src/main/java" "$t/app/src/androidTest" "$t/docs" "$t/tools/glslcheck"
          echo 'float period_ = 0.0f;  // 0 = none yet' > "$t/core/sound/Rhythm.hpp"
          echo 'static constexpr float kFastestBpm = 300.0f;' >> "$t/core/sound/Rhythm.hpp"
          echo 'const double bpm = 93.0;' > "$t/core/tests/musical_test.cpp"
          echo 'for (int i = 0; i < 60 * 120; ++i) e.tick(1.0f / 120.0f);  // 30/60/120 fps, a 120 Hz panel' >> "$t/core/tests/musical_test.cpp"
          echo 'private const val BEAT_SECONDS = 60.0 / BPM' > "$t/app/src/androidTest/Groove.kt"
          bash tools/no-bpm-bias-gate.sh "$t" >/dev/null || { echo "::error::no-BPM-bias gate self-test: clean tree failed"; exit 1; }
          plant() {
            printf '%s\n' "$2" > "$t/$1"
            if bash tools/no-bpm-bias-gate.sh "$t" >/dev/null; then echo "::error::no-BPM-bias gate self-test: passed: $2"; exit 1; fi
            rm "$t/$1"
          }
          plant core/sound/Bias.cpp 'constexpr float kPriorBpm = 120.0f;'
          plant core/sound/Bias.cpp 'const float w = std::exp(-0.5f * x * x);  // log-normal weight on the lag'
          plant core/sound/Bias.cpp 'float periodOrDefault() const;'
          plant core/sound/Bias.cpp 'const float preferredBpm = 100.0f;'
          plant core/viz/Bias.hpp '    float lastBpm_ = 120.0f;'
          plant app/src/main/java/Bias.kt '        const val LEGACY_MORPH_BPM = 120f'
          plant docs/bias.md 'Weight the tempogram with a log-Gaussian prior centred on 120 BPM.'
          plant docs/bias.md 'With no estimate, fall back to 120 BPM.'
          plant docs/bias.md 'tempo = librosa.feature.tempo(onset_envelope=env, start_bpm=120)'
          plant core/tests/Bias.cpp 'const double bpm = 120.0;'
          plant core/tests/Bias.cpp '// A steady groove at 120 BPM.'
          plant core/tests/Bias.cpp 'f.beatPhase = std::fmod(t * 120.0 / 60.0, 1.0);'
          plant app/src/androidTest/Bias.kt '        private const val BEAT_SECONDS = 0.5'
          plant app/src/main/java/Bias.kt 'val beatSeconds = 60.0f / 120.0f'
          plant tools/glslcheck/bias.mjs '  0.5, 0.4, 120, 0.3, //        EVENNESS RUN_DENSITY BPM BEAT_PHASE'
          echo "no-BPM-bias gate self-test passed"

      - name: No tempo prior, preferred tempo or default BPM
        shell: bash
        run: bash tools/no-bpm-bias-gate.sh

      # Pins the action pin gate: a tag must fail it, a SHA and a local workflow must pass.
      - name: Self-test the action pin gate
        shell: bash
        run: |
          set -u
          t=$(mktemp -d)
          mkdir -p "$t/.github/workflows"
          printf '%s\n' '      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1' \
            '    uses: ./.github/workflows/ship-apk.yml' > "$t/.github/workflows/a.yml"
          bash tools/actions-pin-gate.sh "$t" >/dev/null || { echo "::error::pin gate self-test: pinned tree failed"; exit 1; }
          echo '      - uses: actions/checkout@v7' > "$t/.github/workflows/b.yml"
          if bash tools/actions-pin-gate.sh "$t" >/dev/null; then echo "::error::pin gate self-test: tag passed"; exit 1; fi
          echo "action pin gate self-test passed"

      - name: Every action is pinned to a commit SHA
        shell: bash
        run: bash tools/actions-pin-gate.sh

      # The repository's notices and the copy the app ships are one text (LGPL-2.1 2a: the
      # projectM modification notice must not differ between them).
      - name: The notices file equals the shipped asset
        shell: bash
        run: cmp THIRD_PARTY_NOTICES app/src/main/assets/third_party_notices.txt

      # Pins the engine Kotlin gate: growth in an engine path must fail it, shrinking must pass.
      - name: Self-test the engine Kotlin gate
        shell: bash
        run: |
          set -u
          T=$'\t'
          ok() { printf '%s\n' "$@" | bash tools/engine-kotlin-gate.sh >/dev/null; }
          ok "5${T}40${T}engine/scenes/src/main/kotlin/dev/geode/render/Lfo.kt" || { echo "::error::shrink failed"; exit 1; }
          ok "30${T}0${T}app/src/main/java/dev/geode/ui/AppShell.kt" || { echo "::error::ui change failed"; exit 1; }
          ok "12${T}0${T}engine/audio-core/src/main/kotlin/dev/geode/engine/bridge/GeodeNative.kt" || { echo "::error::JNI decls failed"; exit 1; }
          if ok "40${T}0${T}engine/audio-core/src/main/kotlin/dev/geode/engine/audio/PlayoutClock.kt"; then echo "::error::new engine Kotlin passed"; exit 1; fi
          if ok "20${T}5${T}app/src/main/java/dev/geode/export/LoopRender.kt"; then echo "::error::export growth passed"; exit 1; fi
          # Spec 3.0 areas (#461): Record and the timeline, the Scene model, glTF and pack import, the render job.
          A=app/src/main/java/dev/geode
          for f in ui/RecordController.kt record/RecordEncoder.kt editor/Timeline.kt editor/Keyframes.kt \
                   record/RecordClock.kt scene/SceneModel.kt gltf/GltfLimits.kt data/GlbImport.kt \
                   data/StylePackImporter.kt data/MilkPackImporter.kt ui/ExportController.kt; do
            if ok "10${T}2${T}$A/$f"; then echo "::error::growth in $f passed"; exit 1; fi
          done
          ok "10${T}10${T}$A/ui/ExportController.kt" || { echo "::error::even UI edit in ExportController failed"; exit 1; }
          ok "30${T}0${T}$A/ui/RecordController.kt" "0${T}40${T}$A/editor/Timeline.kt" || { echo "::error::net shrink across Record and timeline failed"; exit 1; }
          ok "40${T}0${T}$A/data/RecordFiles.kt" || { echo "::error::recording storage failed"; exit 1; }
          ok "40${T}0${T}$A/editor/StudioProject.kt" || { echo "::error::project list failed"; exit 1; }
          ok "40${T}0${T}$A/ui/StudioRender.kt" || { echo "::error::Studio screen failed"; exit 1; }
          echo "engine Kotlin gate self-test passed"

      - name: Engine Kotlin only shrinks
        shell: bash
        run: |
          git diff --numstat -M \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | bash tools/engine-kotlin-gate.sh
