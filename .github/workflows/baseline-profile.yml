name: Baseline Profile

# Manual only: generates the app's Baseline Profile on an emulator with the :baselineprofile module.
# Nothing is committed here; commit the uploaded files under app/src/main/generated/baselineProfiles/.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geode-baseline-profile-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate the Baseline Profile
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up the Android build
        uses: ./.github/actions/android-build-setup

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The native build before the emulator exists, so it has every vCPU (as in android.yml).
      - name: Build the profiled APKs
        run: ./gradlew :app:assembleNonMinifiedRelease :app:assembleNonMinifiedSideload --stacktrace --no-daemon

      # android.yml's emulator, with animations left on: the profile records the app as users run it.
      - name: Generate the Baseline Profile
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 576M
          cores: 3
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            adb shell input keyevent 82
            ./gradlew :app:generateBaselineProfile --stacktrace --no-daemon
          working-directory: .

      - name: Upload the profile and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-baseline-profile-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/src/main/generated/baselineProfiles/
            baselineprofile/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
