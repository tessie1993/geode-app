name: Build and lint

# The pull-request gate: the debug APK (Kotlin and the native core through CMake).
# Then the manifest promise checks and the release build's banned-SDK scan.
# Then the JVM unit tests of every module.
# Then the linters: detekt, Android lint, ktlint.
# The native host tests (native-host-tests.yml) and the gates (arch-map.yml) run beside it.
# Only the emulator tests stay manual (android.yml): the emulator takes minutes to boot.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-lint-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only documents (tools/ci-docs-only.sh) skips the heavy job below.
  # The heavy job is skipped, not filtered out by `paths`, so its check still reports on the pull
  # request and a required check is never left waiting. It runs unless this job said "true".
  changed:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      # The merge commit and its two parents: the first parent is the base, so the diff is the pull request's.
      - name: Check out tools/ at the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: tools
      - name: Only documents changed
        id: docs
        shell: bash
        run: |
          docs_only=false
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            docs_only=$(git diff --name-only --no-renames HEAD^1 HEAD | bash tools/ci-docs-only.sh)
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  build-lint:
    name: Build and lint
    needs: changed
    if: ${{ !cancelled() && needs.changed.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up the Android build
        uses: ./.github/actions/android-build-setup
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}
          ccache: true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: ccache statistics
        if: always()
        run: ccache -s || true

      - name: Keep only the ccache entries this build used
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RESTORED_AT ))s"

      - name: Save the ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-debug-${{ github.run_id }}

      # The APK this gate just built, downloadable from the run's Summary page, so every
      # pull request has an installable debug build.
      # Uploaded before the linters, so a lint finding still leaves the APK to try.
      # Debug-signed with app/debug.keystore, so it installs over the other CI builds.
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-debug-pr${{ github.event.pull_request.number || 'branch' }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The promises Play and the privacy policy rest on, from one script, so the promise in release.yml holds.
      - name: Check the merged manifest against the app's promises
        run: tools/check-manifest.sh

      # Cast is the app's only internet use. tools/network-gate.sh (arch-map.yml) reads the code and the
      # submodules; this reads what Gradle resolves for the release build.
      # Firebase by product: Cast's own logging (datatransport) brings firebase-encoders, which only
      # serialises its anonymous log records and opens no connection (Data safety declares it).
      # No WebRTC SDK from Maven: Show on a computer uses the native libdatachannel submodule.
      - name: No networking, analytics or ads SDK in the release build
        if: success() || failure()
        run: |
          set -euo pipefail
          deps=$(./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q)
          banned='okhttp|retrofit|ktor|cronet|volley|firebase-(analytics|crashlytics|messaging|perf|config|installations|auth|firestore|database|storage|appcheck|inappmessaging|dynamic-links|ml)|play-services-ads|play-services-measurement|play-services-analytics|crashlytics|sentry|appsflyer|adjust|webrtc|libjingle|io\.getstream|livekit|twilio|agora|org\.jitsi'
          if echo "$deps" | grep -iE "$banned"; then
            echo "::error::A networking, analytics or ads SDK is in the release build; Cast to TV is the only internet use."; exit 1
          fi

      # A red unit test fails the pull request here, not a day later in a manual run.
      - name: Run unit tests
        if: success() || failure()
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace --no-daemon

      - name: detekt
        if: success() || failure()
        run: ./gradlew :app:detekt --continue --stacktrace --no-daemon

      - name: Show detekt findings
        if: failure()
        run: |
          for module in app; do
            f=$module/build/reports/detekt/detekt.txt
            [ -f "$f" ] && { echo "::group::detekt findings ($module)"; cat "$f"; echo "::endgroup::"; }
          done
          true

      - name: Android lint
        if: success() || failure()
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Kotlin formatting (ktlint)
        if: success() || failure()
        run: ./gradlew ktlintCheck --continue --stacktrace --no-daemon

      - name: Upload reports when a check fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            engine/*/build/reports/
            engine/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
