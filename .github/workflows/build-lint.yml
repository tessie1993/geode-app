name: Build and lint

# The pull-request and merged-commit gate: native/network/shader checks, debug and minified
# sideload APKs, the packaged GameActivity/JNI/16 KB contracts, the R8 Configuration Analyzer,
# the manifest and library promises, JVM unit tests, and the Kotlin/Android linters.
# merge-release.yml calls this on the exact commit it is about to publish.

on:
  workflow_dispatch:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces its older run.
concurrency:
  group: build-lint-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Every action is pinned to a commit SHA
        run: bash tools/actions-pin-gate.sh

      - name: Release number regression test
        run: bash tools/release-number-test.sh

      - name: Only cast reaches the network
        run: bash tools/network-gate.sh

      - name: JNI name parity
        run: bash tools/jni-parity-gate.sh

      # tools/hostcc/g++ compiles each source once per flag set, in parallel.
      - name: Put the caching native compiler first on PATH
        run: echo "$GITHUB_WORKSPACE/tools/hostcc" >> "$GITHUB_PATH"

      - name: Native host tests
        run: bash tools/host-tests.sh main

      # Pull requests and manual runs read the shared cache but never replace it.
      - name: Set up the Android build
        uses: ./.github/actions/android-build-setup
        with:
          gradle-cache-read-only: true
          ccache: true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # Release-optimized and R8-minified, but signed with the committed debug key so this gate
      # needs no Play upload-key secrets. assembleSideload also finalizes the Gradle ELF check.
      - name: Assemble minified sideload APK
        id: sideload
        run: ./gradlew :app:assembleSideload --stacktrace --no-daemon

      - name: ccache statistics
        if: always()
        run: ccache -s || true

      # Keep the pull request's ccache entries under its run id.
      - name: Keep only the ccache entries this build used
        if: github.event_name != 'workflow_dispatch'
        run: ccache --evict-older-than "$(( $(date +%s) - CCACHE_RESTORED_AT ))s"

      - name: Save the ccache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-debug-${{ github.run_id }}

      # The APK this gate just built, downloadable from the run's Summary page, so every
      # pull request has an installable debug build. Uploaded before the linters, so a lint
      # finding still leaves the APK to try. Debug-signed with app/debug.keystore.
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-debug-pr${{ github.event.pull_request.number || 'branch' }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Keep the exact minified artifact even when a later packaging gate finds a problem.
      - name: Upload minified sideload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-sideload-pr${{ github.event.pull_request.number || 'branch' }}-${{ github.run_number }}
          path: app/build/outputs/apk/sideload/app-sideload.apk
          if-no-files-found: error
          retention-days: 14

      # Inspect the packaged .so files: GameActivity's callback must be exported, libgeode.so
      # must export exactly one JNI_OnLoad, and every native library must have 16 KB ELF and ZIP
      # alignment. This is deliberately not a device smoke test.
      - name: Verify packaged GameActivity/JNI symbols and 16 KB alignment
        run: bash tools/native-packaging-gate.sh app/build/outputs/apk/sideload/app-sideload.apk

      # AGP 9.5.1 provides the standalone analyzer task. Run it even if the packaging gate
      # above failed, but do not start another Gradle invocation after an earlier build failure.
      - name: Generate R8 Configuration Analyzer report
        if: success() || (failure() && steps.sideload.outcome == 'success')
        run: ./gradlew :app:analyzeReleaseR8Config --stacktrace --no-daemon

      - name: Upload R8 Configuration Analyzer report
        if: always() && steps.sideload.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-r8-config-analyzer-${{ github.run_number }}
          path: app/build/reports/r8/r8-config-analyzer-release.html
          if-no-files-found: error
          retention-days: 14

      - name: Compile every shader and include
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          GLSLC=$(find "$SDK_ROOT/ndk/28.0.13004108/shader-tools" -type f -name glslc -print -quit)
          test -n "$GLSLC" || { echo "::error::NDK glslc not found"; exit 1; }
          python3 tools/check_shaders.py "$GLSLC"

      - name: Check the merged manifest against the app's promises
        run: tools/check-manifest.sh

      # Cast is the app's only internet use. This reads what Gradle resolves for the release build.
      # Firebase by product: Cast's own logging (datatransport) brings firebase-encoders, which only
      # serialises its anonymous log records and opens no connection (Data safety declares it).
      # No WebRTC SDK from Maven: Show on a computer uses the native libdatachannel submodule.
      - name: No networking, analytics or ads SDK in the release build
        if: success() || failure()
        run: |
          set -euo pipefail
          deps=$(./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q)
          banned='okhttp|retrofit|ktor|cronet|volley|firebase-(analytics|crashlytics|messaging|perf|config|installations|auth|firestore|database|storage|appcheck|inappmessaging|dynamic-links|ml)|play-services-ads|play-services-measurement|play-services-analytics|crashlytics|sentry|appsflyer|adjust|webrtc|libjingle|io\.getstream|livekit|twilio|agora|org\.jitsi'
          if echo "$deps" | grep -iE "$banned"; then
            echo "::error::A networking, analytics or ads SDK is in the release build; Cast to TV is the only internet use."; exit 1
          fi

      # A red unit test fails the pull request here, not a day later in a manual run.
      - name: Run unit tests
        if: success() || failure()
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace --no-daemon

      - name: detekt
        if: success() || failure()
        run: ./gradlew :app:detekt --continue --stacktrace --no-daemon

      - name: Show detekt findings
        if: failure()
        run: |
          for module in app; do
            f=$module/build/reports/detekt/detekt.txt
            [ -f "$f" ] && { echo "::group::detekt findings ($module)"; cat "$f"; echo "::endgroup::"; }
          done
          true

      - name: Android lint
        if: success() || failure()
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Kotlin formatting (ktlint)
        if: success() || failure()
        run: ./gradlew ktlintCheck --continue --stacktrace --no-daemon

      - name: Upload reports when a check fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            engine/*/build/reports/
            engine/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
