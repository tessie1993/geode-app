name: Draft preflight

# Fast, local-equivalent checks while a pull request is still a draft. No Gradle, NDK, emulator or
# full test suite runs here. Marking the PR ready hands it to Build and lint; merge-release.yml
# independently verifies and publishes the merged commit.

on:
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: draft-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-commit
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pre-commit
          key: pre-commit-${{ runner.os }}-py313-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-py313-

      - name: Install pre-commit
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
        run: python -m pip install pre-commit==4.7.0

      - name: Validate pre-commit configuration
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
        run: python -m pre_commit validate-config .pre-commit-config.yaml

      - name: Run pre-commit on every tracked file
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit
        run: python -m pre_commit run --all-files --show-diff-on-failure
