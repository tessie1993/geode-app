name: Minified build launches

# Builds the `sideload` APK (the release build's R8 and resource-shrinking configuration, signed
# with the committed debug key so it installs without the upload key), starts it on an emulator
# and fails when the process does not survive the launch. R8 removes and renames what is reached
# only by name, and no other job runs a minified build.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: minified-launch-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  launch:
    name: Minified build launches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up the Android build
        uses: ./.github/actions/android-build-setup
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Before the emulator exists, as in android.yml: the native build needs the runner's vCPUs.
      - name: Assemble the minified APK
        run: ./gradlew :app:assembleSideload :app:analyzeSideloadR8Config --stacktrace --no-daemon

      # Emulator settings are android.yml's instrumented-tests job's (see the comments there).
      - name: Launch it on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 576M
          cores: 3
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/minified-launch.sh app/build/outputs/apk/sideload/app-sideload.apk com.beatrealms3d.app.debug dev.geode.ui.MainActivity
          working-directory: .

      # The APK, what R8 was told and what it did (configuration.txt, mapping.txt, usage.txt,
      # seeds.txt), and the device's account of the launch.
      - name: Upload the APK, the R8 outputs and the launch evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minified-launch-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/sideload/app-sideload.apk
            app/build/outputs/mapping/sideload/
            app/build/reports/r8/
            ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
