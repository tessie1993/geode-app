name: Native host tests

# The pure C++ core (core/) built with the runner's own g++ and run on the host. Seconds, no Android
# SDK. Run it by hand on any branch from the Actions tab.
#
# The suite is the four table tests in core/tests: each builds the text table the core serves to Kotlin
# (catalogue, params schema, Customize map, modulation targets), checks its invariants and compares it
# byte for byte with the committed fixture core/tests/<name>.txt, which the JVM tests read.
#
# After a deliberate change to a table, run this workflow with write_fixtures = true: it regenerates
# the four fixtures with each test's --write and uploads them as the artifact "host-fixtures"
# (gh run download <id> -n host-fixtures), to be committed as they are. Never hand-edit a fixture.

on:
  workflow_dispatch:
    inputs:
      write_fixtures:
        description: "Regenerate the four core/tests/*.txt fixtures and upload them instead of comparing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-host-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CXX_FLAGS: -std=c++20 -O1 -Wall -Wextra -Icore -Icore/tests -Icore/tests/stub

jobs:
  host-tests:
    name: Native host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the host tests
        run: |
          mkdir -p build
          # The catalogue: every style, kind and family (core/viz/Catalogue).
          g++ $CXX_FLAGS core/tests/catalogue_test.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o build/catalogue_test
          # The scene params schema: slots, types, defaults in range (core/viz/Params).
          g++ $CXX_FLAGS core/tests/params_schema_test.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Lfo.cpp core/viz/VisualSafety.cpp -o build/params_schema_test
          # The Customize map: categories and sections (core/viz/CustomizeMap).
          g++ $CXX_FLAGS core/tests/customize_test.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp \
            core/viz/Lfo.cpp core/viz/VisualSafety.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o build/customize_test
          # The modulation targets: reach, slots, polarity (core/viz/ModTargets).
          g++ $CXX_FLAGS core/tests/mod_targets_test.cpp core/viz/ModTargets.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp core/viz/Reactions.cpp \
            core/viz/ReactionDna.cpp core/viz/Lfo.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp -o build/mod_targets_test

      - name: Run the host tests
        if: ${{ !inputs.write_fixtures }}
        run: |
          for t in catalogue params_schema customize mod_targets; do
            ./build/${t}_test core/tests/${t}.txt
          done

      - name: Regenerate the fixtures
        if: ${{ inputs.write_fixtures }}
        run: |
          mkdir -p fixtures
          for t in catalogue params_schema customize mod_targets; do
            ./build/${t}_test --write fixtures/${t}.txt
          done
          ls -l fixtures

      - name: Upload the fixtures
        if: ${{ inputs.write_fixtures }}
        uses: actions/upload-artifact@v4
        with:
          name: host-fixtures
          path: fixtures/*.txt
          if-no-files-found: error
