name: Native host tests

# The pure C++ core (core/) built with the runner's own g++ and run on the host: the render-thread
# maths, the fluid engine, the sound engine and the other host tests in core/tests.
# Minutes, no Android SDK.
# Its own workflow, so a red host test does not hold back the APK build.
# It runs on every pull request, from ship-apk.yml before a push to main publishes, and by hand.

on:
  workflow_dispatch:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to test; empty tests the run's own commit.
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Any other run (a commit ship-apk.yml ships)
# has a group of its own: a later push must not cancel the host tests an earlier commit still waits on.
concurrency:
  group: native-host-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PROJECT_DIR: .

jobs:
  # A pull request that changes only documents (tools/ci-docs-only.sh) skips the heavy job below.
  # The heavy job is skipped, not filtered out by `paths`, so its check still reports on the pull
  # request and a required check is never left waiting. It runs unless this job said "true".
  changed:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      # The merge commit and its two parents: the first parent is the base, so the diff is the pull request's.
      - name: Check out tools/ at the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: tools
      - name: Only documents changed
        id: docs
        shell: bash
        run: |
          docs_only=false
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            docs_only=$(git diff --name-only --no-renames HEAD^1 HEAD | bash tools/ci-docs-only.sh)
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  host-tests:
    name: Native host tests
    needs: changed
    if: ${{ !cancelled() && needs.changed.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Only the submodules a host test compiles: KISS FFT under core/sound, and cgltf,
      # meshoptimizer and basis_universal for the glTF import test.
      - name: Check out the submodules the tests use
        run: |
          git submodule update --init --depth 1 third_party/kissfft third_party/cgltf \
            third_party/meshoptimizer third_party/basis_universal

      # tools/hostcc/g++ compiles each source once per flag set, in parallel, for every line below.
      - name: Put the caching g++ first on PATH
        run: echo "$GITHUB_WORKSPACE/tools/hostcc" >> "$GITHUB_PATH"

      # Every test, its flags and its sources are declared once, in core/tests/host-tests.txt; tools/host-tests.sh
      # builds and runs them, one group per step. Moving a C++ file edits that manifest and not this workflow.
      - name: Native host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tools/host-tests.sh main

      # The analysis thread test again under ThreadSanitizer (the `tsan` group). The runner's kernel
      # randomises mmap with more bits than TSan maps; 28 is what it supports.
      - name: Analysis thread (ThreadSanitizer)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          bash tools/host-tests.sh tsan

      # The threaded and memory-heavy tests again under AddressSanitizer and UndefinedBehaviorSanitizer (the
      # `asan` group). ASan needs the same mmap_rnd_bits as TSan; set here too so the step stands alone.
      - name: Threads and buffers (AddressSanitizer, UndefinedBehaviorSanitizer)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          bash tools/host-tests.sh asan

      # A small golden vector: the whole sound frame of a fixed synthetic song at six instants, within 1e-4.
      - name: Sound golden vector
        id: golden
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tools/host-tests.sh golden
      # When the vector moved, the fixture the engine gives now is the sound-golden artifact: after a deliberate
      # change to core/sound, read its diff and commit it as core/tests/sound_golden.txt (agents never build).
      - name: Rewrite the sound golden vector
        if: ${{ failure() && steps.golden.outcome == 'failure' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p golden-out
          ./sound_golden_test --write golden-out/sound_golden.txt
      - name: Upload the rewritten sound golden vector
        if: ${{ failure() && steps.golden.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sound-golden
          path: ${{ env.PROJECT_DIR }}/golden-out/sound_golden.txt
          if-no-files-found: warn
          retention-days: 14

      # The accuracy bench's smoke run (tools/sound_bench): a few synthetic pieces scored for tempo, beat, meter
      # and key. It measures and exits 0; this only keeps it building and running.
      - name: Sound accuracy bench (smoke)
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tools/host-tests.sh bench
