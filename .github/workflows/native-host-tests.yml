name: Native host tests

# The pure C++ core (core/) built with the runner's own g++ and run on the host: the render-thread
# maths, the fluid engine, the sound engine and the other host tests in core/tests. Seconds, no
# Android SDK. Split out of android.yml so a red host test does not hold back the APK build;
# it runs on every pull request, from ship-apk.yml before a push to main publishes, and by hand.

on:
  workflow_dispatch:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Keyed on the commit for a push to main (called from ship-apk.yml): a later push must not cancel the
# host tests an earlier commit still waits on before it publishes.
concurrency:
  group: native-host-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  PROJECT_DIR: .

jobs:
  host-tests:
    name: Native host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The glTF import test builds against the cgltf and meshoptimizer submodules.
          submodules: recursive

      - name: Native host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub             core/tests/viz_math_test.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/CameraRig.cpp core/viz/MotionField.cpp core/viz/Lfo.cpp             core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o viz_math_test
          ./viz_math_test
          # The scene params schema (#346): unique names, slots in wire order, defaults in range, get/set and the wire, fades, the LFO clamps, the text.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/params_schema_test.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Lfo.cpp core/viz/VisualSafety.cpp -o params_schema_test
          ./params_schema_test
          # Your colours (Customize › Look): HSV and hex, the eyedropper's average, the stops' seamless loop, the stops as params.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/colour_test.cpp core/api/geode_colour_api.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o colour_test
          ./colour_test
          # The palette stack (Customize › Look): each gradient option, the 16-colour and 8-palette caps, Share and Mix, one colour's drawings, the codec and edits, old looks as they drew, recent colours, the library text.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/palette_test.cpp core/viz/Palette.cpp core/api/geode_palette_api.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp -o palette_test
          ./palette_test core/tests/palettes.txt
          # The pinch and twist on the visual (#654): Zoom and Rotation clamped to their schema ranges.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/touch_transform_test.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Lfo.cpp core/viz/VisualSafety.cpp -o touch_transform_test
          ./touch_transform_test
          # Settings › Touch › Smear: the fingers' kicks on the flow field, the bend, its linger, silence and reduced motion.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/touch_smear_test.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Lfo.cpp core/viz/VisualSafety.cpp -o touch_smear_test
          ./touch_smear_test
          # The fluid engine: multigrid pressure plan, MacCormack, splat batching, heat, tracers, tiers.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/fluid_math_test.cpp core/viz/fluid/FluidMath.cpp -o fluid_math_test
          ./fluid_math_test
          # Liquid mode's pure maths: thermal modes, inject weight, the random dive, gestures, born clock, drop flare.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/liquid_test.cpp core/viz/liquid/LiquidMath.cpp -o liquid_test
          ./liquid_test
          # The Pool style's surface: caustics within one safety step, nothing past 3 Hz, true derivatives, still in silence, 30/60/120 fps, wakes.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/pool_test.cpp core/viz/pool/PoolMath.cpp -o pool_test
          ./pool_test
          # The feedback pass's motion, MilkDrop's per-frame UV transform made per second: each term, 30/60/120 fps, sound, silence, the fold.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/feedback_motion_test.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Lfo.cpp core/viz/VisualSafety.cpp -o feedback_motion_test
          ./feedback_motion_test
          # The scene params resolver (#344): the chain's order, reduced motion once, pinned settings, an export's pin (#350), determinism, safety last.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/resolver_test.cpp core/signal/Resolver.cpp core/signal/EngineSettings.cpp core/sound/*.cpp \
            core/viz/Director.cpp core/viz/DirectorReach.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp \
            core/viz/NoteResponse.cpp core/viz/Lfo.cpp core/viz/Adsr.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp \
            core/viz/MacroBank.cpp core/viz/ModTargets.cpp core/viz/MotionField.cpp core/viz/CameraRig.cpp core/viz/VisualSafety.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp \
            core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o resolver_test
          ./resolver_test
          # The director's reach: the shuffle and its modulators over the user's params (seeded, kept controls, scope,
          # ranges, glides at 30/60/120 fps, offsets over the base, Look bit-identical, the export pin, no tempo).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/director_reach_test.cpp core/signal/Resolver.cpp core/signal/EngineSettings.cpp core/sound/*.cpp \
            core/viz/Director.cpp core/viz/DirectorReach.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp \
            core/viz/NoteResponse.cpp core/viz/Lfo.cpp core/viz/Adsr.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp \
            core/viz/MacroBank.cpp core/viz/ModTargets.cpp core/viz/MotionField.cpp core/viz/CameraRig.cpp core/viz/VisualSafety.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp \
            core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o director_reach_test
          ./director_reach_test
          # Which built scenes stay on the GPU (#378): a bounded LRU with pins, spares by thermal tier, lazy resize.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/scene_residency_test.cpp -o scene_residency_test
          ./scene_residency_test
          # The process's one thermal state (#440): the fps-first ladder, the cap on the pacer, two renderers sharing it.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore -Icore/tests/stub core/tests/thermal_test.cpp core/viz/ThermalGovernor.cpp -o thermal_test
          ./thermal_test
          # The program-binary cache's crash sentinel, shared by every renderer in the process (#381).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore core/tests/cache_sentinels_test.cpp -o cache_sentinels_test
          ./cache_sentinels_test
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/sound_test.cpp core/sound/*.cpp -o sound_test
          ./sound_test
          # Absolute loudness (fosfora's LoudnessMeter, ported) and the drive: a quiet sparse pad is low, a loud dense loop high, no normalising.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/absolute_level_test.cpp core/sound/*.cpp -o absolute_level_test
          ./absolute_level_test
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/musical_test.cpp core/sound/*.cpp -o musical_test
          ./musical_test
          # The meter: 3/4 and 4/4 accents at 93 and 141 BPM each read as themselves; a backbeat and an even pulse never become 3.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/meter_test.cpp core/sound/*.cpp -o meter_test
          ./meter_test
          # The auto-director: the emotion table, the live feeling and the director's decisions.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/director_test.cpp core/sound/*.cpp \
            core/viz/Director.cpp core/viz/Reactions.cpp core/viz/Lfo.cpp core/viz/CameraRig.cpp \
            core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp -o director_test
          ./director_test
          # Note & key reactions: knobs by meaning, the drum weight, no param written, off = today.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/note_response_test.cpp core/viz/NoteResponse.cpp -o note_response_test
          ./note_response_test
          # The raw-PCM hand-off: each pushed block reaches the scenes once, so a paused pulse decays.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/pcm_handoff_test.cpp -o pcm_handoff_test
          ./pcm_handoff_test
          # The PCM ingest ring: random chunk sizes and a mid-stream rate change, every sample once, in order, with its rate; the C ABI.
          INGEST_SRCS="core/audio/ingest/PcmRing.cpp core/audio/ingest/AiffReader.cpp core/audio/ingest/TrackFeed.cpp \
            core/audio/ingest/SnapshotStitch.cpp core/api/geode_ingest_api.cpp core/output/FrameClock.cpp"
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore -Icore/tests/stub core/tests/pcm_ring_test.cpp $INGEST_SRCS -o pcm_ring_test
          ./pcm_ring_test
          # An export's track audio (TrackFeed) and the AIFF reader, pinned to the Kotlin TrackAudio and AiffPcm: every
          # sample width and byte order, the header walk, the codec pre-roll and AIFF lead-in cuts, each video frame
          # hearing exactly its audio, an fd span.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore -Icore/tests/stub core/tests/track_feed_test.cpp $INGEST_SRCS -o track_feed_test
          ./track_feed_test
          # The mic layered over the player's ring: the primary's samples stay the clock, the mic resampled to its rate with
          # no frame lost, a silent mic changes nothing, alone after a pause and mixed again on resume, mic on and off mid-stream.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore -Icore/tests/stub core/tests/layer_mix_test.cpp \
            core/audio/ingest/LayerMix.cpp $INGEST_SRCS -o layer_mix_test
          ./layer_mix_test
          # The output mix's snapshots (#999 F10): the ring gains the capture clock's time with no seam, the level holds, and
          # click tracks heard through 20 snapshots a second read their own tempo (butted together they read 2.3x fast).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/snapshot_stitch_test.cpp \
            $INGEST_SRCS core/sound/*.cpp -o snapshot_stitch_test
          ./snapshot_stitch_test
          # The playback output's FIFO (Oboe's feed): odd chunk sizes lose and repeat nothing, an underrun is silence and
          # counted once, the position is monotonic, frozen in pause, reset by a flush and exact at 44.1/48/96 kHz, the
          # volume ramps without a step, a flush under a running consumer plays no torn frame, two threads keep a pattern.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore core/tests/output_fifo_test.cpp core/audio/output/OutputFifo.cpp \
            -o output_fifo_test
          ./output_fifo_test
          # The process-wide Customize layer every renderer draws (#364): set, clamp, generation, follow, export pin.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/layer_state_test.cpp core/viz/LayerState.cpp -o layer_state_test
          ./layer_state_test
          # Which sound the wallpaper and dream hear (#773): a fed ring wins, a stall falls back, no flapping, no permission = ring.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/sound_source_test.cpp core/api/geode_sound_api.cpp core/sound/Tuning.cpp -o sound_source_test
          ./sound_source_test
          # Phone tilt to camera look (#755): baseline capture and recapture, the yaw wrap at +-pi, the clamp, the recentre.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/gyro_look_test.cpp -o gyro_look_test
          ./gyro_look_test
          # An export segment's style schedule: every later style is gated by the entitlement (#357), and it holds in silence (#999 F3).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/style_schedule_test.cpp core/viz/StyleSchedule.cpp -o style_schedule_test
          ./style_schedule_test
          # No hidden hit reactions (owner, 2026-11-12): no core source reads the retired beatResponse, and under
          # core/viz a hit is read only behind a control the user sets (the scenes still listed are known gaps).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror core/tests/hidden_hits_test.cpp -o hidden_hits_test
          ./hidden_hits_test core/
          # Cast's frame clock (#572): steady slots, a stall drops frames instead of bursting, monotonic PTS, the audio cut.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/cast_clock_test.cpp core/api/geode_frame_api.cpp -o cast_clock_test
          ./cast_clock_test
          # The export post-passes' maths: watermark tiling, seam weights (#442).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/export_passes_test.cpp -o export_passes_test
          ./export_passes_test
          # The wallpaper's edge glow, the first frame::Pass (#439): options, the VU envelope, the band and its mask.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/edge_glow_test.cpp -o edge_glow_test
          ./edge_glow_test
          # The live wallpaper's on-screen window from the launcher's raw offsets, and its fps pick (#605).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/wallpaper_window_test.cpp -o wallpaper_window_test
          ./wallpaper_window_test
          # The edge glow as a frame::Pass over a faked GL context (core/tests/fakegl, not the stub dir): its
          # lifetime (create, release, rebuild, a new context's reused names) and what one frame leaves in the target.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/fakegl core/tests/edge_glow_pass_test.cpp core/viz/frame/EdgeGlowPass.cpp core/viz/Program.cpp core/viz/ShaderSource.cpp -o edge_glow_pass_test
          ./edge_glow_pass_test
          # The GL Transitions library parse the renderer and the shell share, and the shell's table (#438).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/transition_library_test.cpp core/util/Json.cpp -o transition_library_test
          ./transition_library_test
          # The transition programs over a faked GL context: a transition that fails to build is tried once per context, a rebuilt one gets its params again.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/fakegl core/tests/transition_programs_test.cpp core/viz/Transition.cpp core/viz/Program.cpp core/viz/ShaderSource.cpp \
            core/viz/VisualSafety.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Lfo.cpp core/util/Json.cpp -o transition_programs_test
          ./transition_programs_test
          # Settings › Performance's tiers and the first-run pick for this phone (#437).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/quality_test.cpp -o quality_test
          ./quality_test
          # The live wallpaper's and the dream's run rule: priority order, preview, listening, the trial's exact end and its restate, the 6 s silence clock (#376).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/surface_run_test.cpp core/api/geode_surface_api.cpp core/api/geode_sound_api.cpp core/sound/Tuning.cpp -o surface_run_test
          ./surface_run_test
          # The background image bake (#651): the crop rect and dim exact with the old Kotlin, the blur keeps a flat image, the clamps.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/underlay_test.cpp core/viz/Underlay.cpp core/api/geode_underlay_api.cpp -o underlay_test
          ./underlay_test
          # Reduced motion on the wallpaper and the dream over every flag, the still frame's settle table, each surface's fps choice as the pacer draws it (#441).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/surface_motion_test.cpp core/api/geode_surface_api.cpp -o surface_motion_test
          ./surface_motion_test
          # Auto's style timer: the interval plus a spread per look, never sooner than the interval; the duration a .milk preset's progress runs over; the random draw never repeating what is on screen.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/auto_timer_test.cpp core/api/geode_auto_api.cpp -o auto_timer_test
          ./auto_timer_test
          # What the stage's next/previous style steps: the open tab's list (.milk presets on MilkDrop or while it is on screen, saved looks on Presets, styles elsewhere), the walk's wrap and locks, the .milk history.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/stage_step_test.cpp core/api/geode_stage_step_api.cpp -o stage_step_test
          ./stage_step_test
          # Visuals › Styles: Random over every family (or the on-screen family alone), never the style on screen, a kept style first; every list leads with what is on screen.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/style_pick_test.cpp core/api/geode_style_pick_api.cpp -o style_pick_test
          ./style_pick_test
          # A .milk preset whose warp or composite shader failed plays on the default one; the stage's note says which.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/milk_shader_note_test.cpp -o milk_shader_note_test
          ./milk_shader_note_test
          # A loaded .milk counts as shown, and is remembered for the next start, only once it has drawn clean frames.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/milk_shown_test.cpp -o milk_shown_test
          ./milk_shown_test
          # A style change's transition: "random" draws one per change, never twice running; Auto's change fades for MilkDrop's longer time, read once per renderer.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/transition_choice_test.cpp -o transition_choice_test
          ./transition_choice_test
          # The frame clock every surface shares (#436): vsync divides, the settle window, hitches, resume, one dt clamp.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/pacer_test.cpp -o pacer_test
          ./pacer_test
          # Settings › Performance's live cap above 60: the caps a display is offered, the stored cap snapped to it, the thermal walk 120 to 90, 60, 30.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/live_fps_test.cpp -o live_fps_test
          ./live_fps_test
          # What a live frame owes the shell (#604): the first-frame clear, the quality dedupe, the thermal and Liquid bits.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/renderer_cadence_test.cpp -o renderer_cadence_test
          ./renderer_cadence_test
          # The process-wide shader overrides every renderer draws (#364): set, replace, clear, generation, copies.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore core/tests/shader_overrides_test.cpp core/viz/ShaderOverrides.cpp -o shader_overrides_test
          ./shader_overrides_test
          # The library's one match (Library screen, Android Auto, voice "play X", #382): folding, ranking, order, the index.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/library_search_test.cpp core/library/Search.cpp core/api/geode_library_api.cpp -o library_search_test
          ./library_search_test
          # The playout clock (#349, #482): the ring sample the speaker plays at 1x and 1.5x, behind a 250 ms
          # Bluetooth link, over pause, resume, skipped silence, a seek and the A/V offset, the same at 30/60/120 fps.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/playout_test.cpp core/sound/interp/PlayoutClock.cpp \
            core/api/geode_playout_api.cpp -o playout_test
          ./playout_test
          # Speaker sync (#349, #488): the real ring, cursor and playout clock behind a fake sink. A reader held
          # to the speaker reads nothing of the sink's first buffer until it plays, every frame once at
          # 30/60/120 fps, stands in a pause, drops a seek's unheard tail, reads a gapless tail, is not
          # overrun at 192 kHz over Bluetooth; the mic, Cast and a ring with no sink read the newest.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/speaker_sync_test.cpp \
            core/audio/ingest/PcmRing.cpp core/sound/interp/PlayoutClock.cpp -o speaker_sync_test
          ./speaker_sync_test
          # The encoder fallback ladder (#607): the rungs, the 30 fps floor, the 2/3 bit rate, an unknown ceiling.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/encoder_ladder_test.cpp core/api/geode_output_api.cpp -o encoder_ladder_test
          ./encoder_ladder_test
          # glTF import (#474): #455's limits on fixture .glb files built by the test, the 4x decimation
          # with before/after counts, refusals, and the low-detail copy; and the textures (PNG, JPEG,
          # KTX2 built in the test): role caps, mips, ASTC/ETC2 blocks decoded back, the memory budget
          # fit and drops. Uses the cgltf, meshoptimizer and basis_universal submodules. Basis builds
          # as upstream does (C++17, NDEBUG, its warnings off), in parallel, the same file list as
          # geode_basisu in core/CMakeLists.txt.
          BASISU=third_party/basis_universal
          BASISU_DEFS="-DBASISU_SUPPORT_SSE=0 -DBASISU_SUPPORT_OPENCL=0 -DBASISD_SUPPORT_KTX2=1 -DBASISD_SUPPORT_KTX2_ZSTD=1"
          mkdir -p basisu_obj
          sed -n '/add_library(geode_basisu STATIC/,/zstd.c)/p' core/CMakeLists.txt | grep -oE 'encoder/[A-Za-z0-9_/]+\.cpp|transcoder/[A-Za-z0-9_]+\.cpp' \
            | xargs -P "$(nproc)" -I{} sh -c 'g++ -std=c++17 -O2 -DNDEBUG -w -fno-strict-aliasing '"$BASISU_DEFS"' -DBASISU_SUPPORT_ASTCENC=0 \
                -c "'"$BASISU"'/$0" -o "basisu_obj/$(echo "$0" | tr / _).o"' {}
          gcc -O2 -DNDEBUG -w -c "$BASISU/zstd/zstd.c" -o basisu_obj/zstd.o
          test "$(ls basisu_obj/*.o | wc -l)" -eq 32
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -isystem third_party/cgltf -isystem third_party/meshoptimizer/src -isystem "$BASISU" $BASISU_DEFS \
            core/tests/gltf_import_test.cpp core/scene/object/GltfImport.cpp core/scene/object/ModelTextures.cpp \
            third_party/meshoptimizer/src/simplifier.cpp third_party/meshoptimizer/src/vertexcodec.cpp \
            third_party/meshoptimizer/src/indexcodec.cpp third_party/meshoptimizer/src/vertexfilter.cpp basisu_obj/*.o -pthread -o gltf_import_test
          ./gltf_import_test
          # One live frame as one call: the stage order, the clear-only frame, the scene retry, gyro sessions, the thermal slot, the events.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore -Icore/tests/stub core/tests/live_frame_test.cpp -o live_frame_test
          ./live_frame_test
          # The loop seam driver (#603): stash or present, the PTS, the dissolve weight and the 192 MB budget.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/loop_seam_test.cpp -o loop_seam_test
          ./loop_seam_test
          # Cast's audio pump (#772): a steady feed, a paused feed padded to the cut, a feed ahead held, 3 h sample-exact at 48 kHz.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/cast_audio_test.cpp core/api/geode_frame_api.cpp -o cast_audio_test
          ./cast_audio_test
          # Morph World: the World Genome (bounds, lerp, seeds, 1000 random worlds open and lit, the
          # corridor at the camera), the morph driver (replayable, seeded, no flash) and lib_world's names.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/world_genome_test.cpp core/viz/world/WorldGenome.cpp             core/viz/world/MorphDriver.cpp core/viz/world/WorldAssets.cpp core/viz/CameraRig.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp             core/viz/VisualSafety.cpp core/viz/Lfo.cpp -o world_genome_test
          ./world_genome_test app/src/main/assets/shaders/lib_world.glsl             app/src/main/assets/shaders/world_shapes.bin app/src/main/assets/shaders/world_textures.bin
          # Cast's HLS timing (#656): segment durations from the fragment's media time, TARGETDURATION, the playlist text.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/hls_segments_test.cpp core/api/geode_frame_api.cpp -o hls_segments_test
          ./hls_segments_test
          # Cast's tee: the stage's own picture to the stream (no second render): the triple-buffer hand-off, the fallback after a stale copy, one copy per cast frame from any stage rate, the placement (a portrait stage turned, every stage centre-cropped).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/cast_tee_test.cpp -o cast_tee_test
          ./cast_tee_test
          # Cast shows the phone's own visual: the stage keeps drawing while a cast streams (before Visuals was ever laid out too) in its whole rect, the tee turning a portrait stage and its centred crop filling the stream with no bars, and a new stream waits for its first copy.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/cast_same_visual_test.cpp core/api/geode_surface_api.cpp core/api/geode_sound_api.cpp core/sound/Tuning.cpp core/api/geode_frame_api.cpp -o cast_same_visual_test
          ./cast_same_visual_test
          # Show on a computer: the browser link's routes and token check, every response head, the codecs from the init segment, the page's files, the share's state, the browser's live feed, WebRTC's signalling and the link maker.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/link_share_test.cpp core/api/geode_link_api.cpp core/viz/frame/LinkShare.cpp core/util/QrCode.cpp -o link_share_test
          ./link_share_test
          # Show on a computer over WebRTC (core/viz/frame/WebRtcRule): the encoder's H.264 as sent, the browser's offer read, the LAN-only candidates both ways, the RTP clock.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/webrtc_rule_test.cpp core/viz/frame/WebRtcRule.cpp core/viz/frame/LinkShare.cpp -o webrtc_rule_test
          ./webrtc_rule_test
          # Its QR code: the standard's vectors (RS, format and version bits, capacities) and every symbol read back by an independent reader.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/qr_code_test.cpp core/api/geode_link_api.cpp core/viz/frame/LinkShare.cpp core/util/QrCode.cpp -o qr_code_test
          ./qr_code_test
          # The config params schema (#423): LFO, envelope, palette, look and morph rows; Lfo and Adsr clamp as before; the store conversions equal Kotlin's; the text.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/config_schema_test.cpp core/viz/ConfigFields.cpp core/viz/Adsr.cpp core/viz/Lfo.cpp \
            core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/CameraRig.cpp core/viz/MotionField.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp \
            core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o config_schema_test
          ./config_schema_test
          # The renderer's reaction resolve (#750): DNA, or the user's routes under the hand mask, as the old Kotlin path; resolved exactly on a change of scene, seed, routes or mask.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/reaction_resolve_test.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/CameraRig.cpp core/viz/MotionField.cpp core/viz/Lfo.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o reaction_resolve_test
          ./reaction_resolve_test

      # Moved from android.yml, which runs by hand: there a stale fixture and a failing crossfade test
      # went unseen for days. Each fixture below is what the JVM tests read as "what native emits".
      # The scene and style catalogue (core/viz/Catalogue): ids, families, param scopes (the params schema's
      # meta rows, hence Params), ranges, and
      # its text table byte-equal to core/tests/catalogue.txt, the copy the JVM tests read.
      - name: Catalogue host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/catalogue_test.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp \
            core/viz/Params.cpp core/viz/ParamsFields.cpp -o catalogue_test
          ./catalogue_test core/tests/catalogue.txt
          # Shader truth: each shader style's camera rig and march facts against what its assembled shader reads,
          # and every Customize control a style shows moves it (known gaps: core/tests/style_param_gaps.txt, only shrinks).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/fakegl core/tests/style_reads_test.cpp core/viz/ShaderSource.cpp core/viz/Catalogue.cpp \
            core/viz/scenes/StyleCatalog.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp \
            -o style_reads_test
          ./style_reads_test app/src/main/assets/ --gaps core/tests/style_param_gaps.txt --core core/
          # The visual gate's judge (#470): compiled so it keeps building; its render jobs left CI in #786, it runs by hand (tools/glslcheck README).
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/visual_gate.cpp -o visual_gate
          # The bundled looks (#648): every value pinned to the Kotlin literals it replaced, the text read back bit for bit.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/presets_test.cpp core/viz/CataloguePresets.cpp core/viz/Catalogue.cpp \
            core/viz/scenes/StyleCatalog.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp -o presets_test
          ./presets_test
      # The modulation-target table (core/viz/ModTargets, #642): each target's scope and chained slot, the
      # slot defaults, each source's natural polarity, and its text byte-equal to core/tests/mod_targets.txt.
      - name: Modulation target host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/mod_targets_test.cpp core/viz/ModTargets.cpp \
            core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/Lfo.cpp \
            core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp -o mod_targets_test
          ./mod_targets_test core/tests/mod_targets.txt
      # The saved text of the user's reaction routes (core/viz/ReactionText), pinned to the Kotlin codec it replaced.
      - name: Reaction text host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/reaction_text_test.cpp core/viz/ReactionText.cpp \
            core/api/geode_reaction_text_api.cpp core/viz/ModTargets.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp \
            core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/Lfo.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp \
            core/viz/VisualSafety.cpp -o reaction_text_test
          ./reaction_text_test
      # Random on waves: the two random wave shapes (a value per cycle, the same at 30/60/120 fps, per slot and seed,
      # a tempo only once the music gives one) and the roll of a set of waves (core/viz/WaveRandomizer).
      - name: Random waves host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/lfo_random_test.cpp core/viz/WaveRandomizer.cpp \
            core/viz/ModTargets.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp core/viz/Reactions.cpp core/viz/ReactionDna.cpp \
            core/viz/Lfo.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/VisualSafety.cpp -o lfo_random_test
          ./lfo_random_test
      # The macro bank (core/viz/MacroBank): the user's knobs as weighted offsets on scene params. Centre is
      # the identity, both ways move, the range and the safety clamp hold, edits validate, the text round trips,
      # the process-wide bank (geode_macro_bank_set).
      - name: Macro bank host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/macro_bank_test.cpp core/viz/MacroBank.cpp core/viz/MacroControls.cpp \
            core/api/geode_macro_bank_api.cpp core/viz/ModTargets.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp \
            core/viz/Reactions.cpp core/viz/ReactionDna.cpp core/viz/Lfo.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp \
            core/viz/VisualSafety.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp -o macro_bank_test
          ./macro_bank_test
      # The export DSP (resampler, BS.1770 loudness meter), ported from Kotlin (ADR 0003), the playback DSP's hand-off and its gain.
      - name: Native export DSP tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/resampler_test.cpp core/audio/dsp/PcmResampler.cpp core/audio/dsp/Loudness.cpp core/audio/dsp/PcmConvert.cpp core/api/geode_export_dsp_api.cpp -o resampler_test
          ./resampler_test
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/loudness_test.cpp core/audio/dsp/PcmResampler.cpp core/audio/dsp/Loudness.cpp core/audio/dsp/PcmConvert.cpp core/api/geode_export_dsp_api.cpp -o loudness_test
          ./loudness_test
          # The playback DSP's format hand-off (#356): the old format's tail drains through its own chain
          # until flush, and no block is ever processed past its buffer.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/dsp_handoff_test.cpp core/api/geode_dsp_api.cpp \
            core/audio/dsp/DspProcessor.cpp core/audio/dsp/GainStage.cpp core/audio/dsp/Equalizer.cpp core/audio/dsp/Crossfeed.cpp core/audio/dsp/Limiter.cpp -o dsp_handoff_test
          ./dsp_handoff_test
          # Bit-perfect USB (#353, #489): with bit-perfect live the playback DSP passes every byte through,
          # whatever gain, EQ, crossfeed or limiter is set; plus the native 16-bit conversion.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/bit_perfect_test.cpp core/api/geode_dsp_api.cpp \
            core/audio/dsp/DspProcessor.cpp core/audio/dsp/GainStage.cpp core/audio/dsp/Equalizer.cpp core/audio/dsp/Crossfeed.cpp core/audio/dsp/Limiter.cpp -o bit_perfect_test
          ./bit_perfect_test
          # The playback gain as native ramps (#483): linear in dB and sample-accurate, ReplayGain on the
          # boundary sample (#351), the crossfade's halves mirrored, the sleep fade, bit-identical at 0 dB.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/gain_ramp_test.cpp core/api/geode_dsp_api.cpp core/audio/dsp/DspProcessor.cpp core/audio/dsp/GainStage.cpp core/audio/dsp/Equalizer.cpp core/audio/dsp/Crossfeed.cpp core/audio/dsp/Limiter.cpp -o gain_ramp_test
          ./gain_ramp_test
          # Settings › Playback's speed and pitch rows: a semitone as a rate, a slider value on its step.
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/playback_controls_test.cpp core/audio/dsp/PlaybackControls.cpp core/api/geode_playback_api.cpp -o playback_controls_test
          ./playback_controls_test

      # Export planning and PCM maths ported from Kotlin (ADR 0003, ADR 0006 core/output): frame clock,
      # loops, encoder budget, chapters, PCM conversion and timing, each through its C ABI too; and a recorded
      # take's limits (core/output/RecordPlan: the offered maximum lengths, the stop, the file size estimate).
      - name: Native export planning tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          EXPORT_SRCS="core/api/geode_export_api.cpp core/output/FrameClock.cpp core/output/LoopPlan.cpp core/output/LoudnessAdvice.cpp core/output/EncodePlan.cpp core/output/RecordPlan.cpp core/output/Chapters.cpp core/audio/dsp/PcmConvert.cpp core/audio/dsp/PcmTiming.cpp"
          for t in output_test record_plan_test export_pcm_test; do
            g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/$t.cpp $EXPORT_SRCS -o $t
            ./$t
          done

      # Record's clock (core/output/Recorder): which stage frames a live recording keeps and their PTS at
      # 30, 60 and 120 fps, where each heard sample sits, a pause, a seek, a rate change, the limits.
      - name: Recorder host test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -pthread -Icore -Icore/tests/stub \
            core/tests/recorder_test.cpp core/api/geode_record_api.cpp core/output/Recorder.cpp \
            core/output/EncodePlan.cpp core/audio/dsp/PcmResampler.cpp -o recorder_test
          ./recorder_test

      # The Customize randomizer, Reset tab and params wire (core/viz/ParamRandomizer, core/viz/Params).
      - name: Params host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/params_test.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o params_test
          ./params_test

      # The Customize panel's nine categories, their sections and per-category roll and reset (core/viz/CustomizeMap).
      - name: Customize map host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/customize_test.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o customize_test
          ./customize_test core/tests/customize.txt

      # The two-circle gesture's Randomize everything (core/viz/RandomizeAll): a seeded style and look, never a locked style, every category rolled, Keep held.
      - name: Randomize everything host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/randomize_all_test.cpp core/viz/RandomizeAll.cpp core/api/geode_randomize_all_api.cpp core/viz/CustomizeMap.cpp core/viz/ParamRandomizer.cpp core/viz/Params.cpp core/viz/ParamsFields.cpp core/viz/Catalogue.cpp core/viz/scenes/StyleCatalog.cpp -o randomize_all_test
          ./randomize_all_test

      # The hidden Visuals gestures: shake to screenshot's detector (core/viz/Shake) and tap along's beat matcher (core/viz/TapAlong).
      - name: Easter egg host tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/easter_eggs_test.cpp core/api/geode_shake_api.cpp -o easter_eggs_test
          ./easter_eggs_test

      # The artwork palette (core/viz/ArtPalette): a cover's base hue, span and confidence, pinned to the Kotlin it replaced.
      - name: Artwork palette
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore -Icore/tests/stub core/tests/art_palette_test.cpp core/viz/ArtPalette.cpp core/api/geode_art_palette_api.cpp -o art_palette_test
          ./art_palette_test

      # The sound engine at 30 and 120 fps must equal 60 at every shared sample, and an export's cut equal live's.
      - name: Sound across frame rates
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/sound_rate_test.cpp core/sound/*.cpp core/output/FrameClock.cpp -o sound_rate_test
          ./sound_rate_test

      # An export's start (core/output/PreRoll, #999 F1 F2 F4): the engine hears the track before frame 0, so the first
      # half second and a loop's head run the clock whole, mid-song frame 0 hears live's tempo, a track with no audio fails.
      # And F3: a silent stretch holds the export's frames and its beat cut, like the live visual.
      - name: Export pre-roll
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/export_preroll_test.cpp core/sound/*.cpp \
            core/output/FrameClock.cpp core/audio/ingest/TrackFeed.cpp core/audio/ingest/AiffReader.cpp core/viz/StyleSchedule.cpp \
            -o export_preroll_test
          ./export_preroll_test

      # A small golden vector: the whole sound frame of a fixed synthetic song at six instants, within 1e-4.
      - name: Sound golden vector
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -Icore core/tests/sound_golden_test.cpp core/sound/*.cpp -o sound_golden_test
          ./sound_golden_test core/tests/sound_golden.txt

      # The accuracy bench's smoke run (tools/sound_bench): a few synthetic pieces scored for tempo, beat, meter
      # and key. It measures and exits 0; this only keeps it building and running.
      - name: Sound accuracy bench (smoke)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Icore tools/sound_bench/sound_bench.cpp core/sound/*.cpp -o sound_bench
          ./sound_bench --quick
