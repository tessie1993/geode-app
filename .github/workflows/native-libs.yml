name: Rebuild native libs (16 KB aligned)

# Google Play requires 16 KB page-size support for apps targeting Android 15+
# (API 35 and above). The libprojectM-4.so checked into app/src/main/jniLibs
# must therefore have ELF LOAD segments aligned to 16384, which means building
# it with NDK r28 (16 KB is its default) plus the explicit max-page-size linker
# flag.
#
# Run this manually, download each ABI's artifact, drop its .so AND its
# SHA256SUMS into app/src/main/jniLibs/<abi>/ and commit them together: the
# SHA256SUMS carries the run URL that lets the repo prove the committed blob
# matches the projectM tag. android.yml verifies the hash on every pull
# request.
#
# Only the engine is built here. The JNI bridge (app/src/main/cpp) is compiled
# by the app build itself through the NDK, so it never needs to be committed;
# the same NDK version and page-size flags apply there.
#
# The engine is built STOCK — no patches. It renders to the default
# framebuffer exactly as upstream ships it; the app copies the frame off
# framebuffer 0 (see MilkdropScene.kt).

on:
  workflow_dispatch:
    inputs:
      projectm_tag:
        description: projectM release tag to build
        default: v4.1.7
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        # arm64-v8a ships to devices; x86_64 exists so the CI emulator (and
        # ChromeOS / developer emulators) can actually load the engine —
        # without it MilkdropEngine.available is false on the emulator and no
        # instrumented test can exercise the MilkDrop pipeline at all.
        abi: [arm64-v8a, x86_64]
    env:
      # NDK r28 defaults to 16 KB-aligned shared objects.
      NDK_VERSION: 28.0.13004108
      ABI: ${{ matrix.abi }}
      API: 26
      PAGE_FLAGS: -Wl,-z,max-page-size=16384,-z,common-page-size=16384
    steps:
      - uses: actions/checkout@v7

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Clone projectM ${{ inputs.projectm_tag }}
        run: |
          set -euo pipefail
          # Build from a release tag, never master: master carries experimental
          # GL bootstrap code that breaks Android rendering (tools/build-projectm.md).
          git clone --branch "${{ inputs.projectm_tag }}" --depth 1 --recurse-submodules \
            https://github.com/projectM-visualizer/projectm.git projectm

      - name: Build libprojectM-4.so
        run: |
          set -euo pipefail
          cmake -B build-android -S projectm \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="android-$API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_PLAYLIST=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="$PAGE_FLAGS" \
            -G Ninja
          ninja -C build-android

      - name: Collect libprojectM-4.so
        run: |
          set -euo pipefail
          mkdir -p out
          find build-android -name 'libprojectM-4.so' -exec cp {} out/ \;

      # The engine's public headers vendored under app/src/main/cpp/include must
      # be the ones this .so was built from, or the bridge compiles against an
      # API the binary does not have.
      - name: Verify the vendored API headers match this tag
        run: |
          set -euo pipefail
          diff -r projectm/src/api/include/projectM-4 app/src/main/cpp/include/projectM-4 \
            --exclude=projectM_export.h --exclude=version.h
          diff build-android/src/api/include/projectM-4/version.h app/src/main/cpp/include/projectM-4/version.h

      # This .so is committed and shipped as-is, and unstripped it carries
      # about 11 MB of DWARF that no device reads. Strip here, before the
      # checksums, so the recorded hash describes the bytes that actually ship.
      # --strip-unneeded keeps .dynsym, so the projectm_* API the bridge links
      # against survives.
      - name: Strip debug symbols
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          for so in out/*.so; do
            before=$(stat -c%s "$so")
            "$TOOLCHAIN/bin/llvm-strip" --strip-unneeded "$so"
            echo "$(basename "$so"): $before -> $(stat -c%s "$so") bytes"
          done

      - name: Verify 16 KB alignment
        run: |
          set -euo pipefail
          fail=0
          for so in out/*.so; do
            readelf -lW "$so" | awk '$1 == "LOAD"'
            for a in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ "$((a))" -lt 16384 ]; then
                echo "::error file=$so::LOAD segment aligned to $a, needs >= 16384"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "All LOAD segments are 16 KB aligned."
          exit "$fail"

      - name: Record provenance checksums
        run: |
          set -euo pipefail
          cd out
          {
            echo "# Provenance of the prebuilt library committed in this directory."
            echo "#"
            echo "# Built by native-libs.yml run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "# projectM ${{ inputs.projectm_tag }}, stock (no patches)."
            echo "# The JNI bridge (libmilkdropjni.so) is not committed: the app build compiles"
            echo "# it from app/src/main/cpp with the NDK."
            echo "# Commit this file alongside the .so it describes;"
            echo "# android.yml verifies the hash on every pull request."
            sha256sum *.so
          } > SHA256SUMS
          cat SHA256SUMS

      - name: Upload native libs
        uses: actions/upload-artifact@v7
        with:
          name: jniLibs-${{ matrix.abi }}-16k
          path: |
            out/*.so
            out/SHA256SUMS
          retention-days: 30
