name: Play Store release

# Builds the signed Android App Bundle to upload to Play Console.
#
# Required repository secrets:
#   MUSICVIZ_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   MUSICVIZ_KEYSTORE_PASSWORD
#   MUSICVIZ_KEY_ALIAS
#   MUSICVIZ_KEY_PASSWORD
#
# Produce the first value with:  base64 -w0 geode-upload.jks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # The platform matches compileSdk; NDK and CMake match ndkVersion and
      # externalNativeBuild.cmake.version in app/build.gradle.kts, and
      # bundleRelease compiles the MilkDrop JNI bridge from app/src/main/cpp
      # with them.
      - name: Install Android SDK 36, NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICVIZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::MUSICVIZ_KEYSTORE_BASE64 secret is not set; cannot produce a signed bundle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Verify (ktlint, tests, lint)
        run: ./gradlew ktlintCheck testDebugUnitTest lint --stacktrace

      # The secrets keep their MUSICVIZ_ names, but app/build.gradle.kts reads
      # GEODE_ — so they are exported under the names the build looks for.
      # Mismatched, signingConfigs stays empty, bundleRelease silently produces
      # an unsigned bundle and the next step is the first thing to notice.
      - name: Build signed AAB
        env:
          GEODE_KEYSTORE: ${{ runner.temp }}/upload.jks
          GEODE_KEYSTORE_PASSWORD: ${{ secrets.MUSICVIZ_KEYSTORE_PASSWORD }}
          GEODE_KEY_ALIAS: ${{ secrets.MUSICVIZ_KEY_ALIAS }}
          GEODE_KEY_PASSWORD: ${{ secrets.MUSICVIZ_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Confirm the bundle is signed
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$aab" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            || { echo "::error::$aab is not signed"; exit 1; }
          ls -l "$aab"

      - name: Upload AAB and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: geode-release-bundle
          # The mapping file must be uploaded to Play Console alongside the
          # bundle, otherwise crash traces stay obfuscated.
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
