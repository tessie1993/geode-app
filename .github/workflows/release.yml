name: Play release bundle

# Builds the Android App Bundle (.aab) that goes to Play Console, and checks the
# things Play and the app's own promises depend on before anyone uploads it.
#
# Runs only on request (Actions > Play release bundle > Run workflow): pull requests and
# tags don't build it. It signs with the upload key; without the key it fails, unless the run
# asks for an unsigned bundle (a dry run, never for Play). It also fails when a check on the
# commit is red. The manifest promise checks (INTERNET only with Cast, no AD_ID, targetSdk) are
# tools/check-manifest.sh, which build-lint.yml runs on every PR against the debug manifest; here
# it reads the release manifest and adds the permission list.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   MUZVIZ_UPLOAD_KEYSTORE_BASE64   base64 of the upload keystore (.jks):
#                                   base64 -w0 beatrealms-upload.jks
#   MUZVIZ_UPLOAD_STORE_PASSWORD    the keystore password
#   MUZVIZ_UPLOAD_KEY_ALIAS         the key alias inside it
#   MUZVIZ_UPLOAD_KEY_PASSWORD      the key password
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   PLAY_LICENSE_KEY   Play Console > Monetize with Play > Monetization setup >
#                      Licensing: the Base64 RSA public key. Public, not a secret;
#                      the app checks purchase signatures with it.

on:
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: "Dry run: build an UNSIGNED bundle when the upload key is missing (not for Play)"
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: geode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      # The release job runs no tests of its own: the commit's own checks (unit tests, lint, host
      # tests, the gates) are the gate, so a red or still-running one stops the bundle.
      - name: The commit's checks are green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | select(.name != "Build release AAB") | "\(.status)\t\(.conclusion)\t\(.name)"')
          echo "$runs"
          echo "$runs" | grep -q "Native host tests" || { echo "::error::No Native host tests run on this commit."; exit 1; }
          bad=$(echo "$runs" | awk -F'\t' '$1 != "completed" || ($2 != "success" && $2 != "skipped" && $2 != "neutral")')
          if [ -n "$bad" ]; then
            echo "::error::Checks on this commit are not green: $(echo "$bad" | cut -f3 | paste -sd, -)"
            exit 1
          fi

      # bundleRelease compiles the native core with the NDK and CMake this installs.
      - name: Set up the Android build
        uses: ./.github/actions/android-build-setup

      # Only a manual run on the repository's own branches reaches this, so the upload key is
      # never readable by pull request code. A missing key fails, unless the run asked for unsigned.
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUZVIZ_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUZVIZ_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUZVIZ_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUZVIZ_UPLOAD_KEY_PASSWORD }}
          LICENSE_KEY: ${{ vars.PLAY_LICENSE_KEY }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail
          # A key that is set must be a Base64 X.509 RSA public key (billing/PurchaseVerifier.kt
          # refuses every purchase otherwise), signed bundle or not.
          if [ -n "${LICENSE_KEY:-}" ] && ! echo "$LICENSE_KEY" | base64 -d | openssl rsa -pubin -inform DER -noout 2>/dev/null; then
            echo "::error::PLAY_LICENSE_KEY (repository variable) is not a Base64 X.509 RSA public key."
            exit 1
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            if [ "$ALLOW_UNSIGNED" != "true" ]; then
              echo "::error::Upload key secrets incomplete (the four MUZVIZ_UPLOAD_* secrets at the top of release.yml). Run with allow_unsigned for a dry run."
              exit 1
            fi
            [ -n "${LICENSE_KEY:-}" ] || echo "::warning::PLAY_LICENSE_KEY (repository variable) is not set either."
            echo "::warning::Upload key secrets incomplete: building an UNSIGNED bundle. The four MUZVIZ_UPLOAD_* secrets are listed at the top of release.yml."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A signed bundle can go to Play, and without the licence key it would refuse every purchase
          # (billing/PurchaseVerifier.kt), so signing requires it.
          if [ -z "${LICENSE_KEY:-}" ]; then
            echo "::error::PLAY_LICENSE_KEY (repository variable) is not set; a signed store build must verify purchase signatures."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # app/build.gradle.kts reads the GEODE_* names; all four are required to sign.
      # Same version rule as the pre-releases (root build.gradle.kts): the AAB carries the
      # number this commit shipped as (tag apk-v<base>.N), so it matches that pre-release.
      # A commit that never shipped has no number and a signed build fails here: borrowing the
      # latest one could repeat a versionCode already uploaded to Play.
      - name: Release number
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^geode\.versionBase=//p' gradle.properties | tr -d '\r')
          # Without a number, an unsigned dry run builds as <base>-dev: it cannot go to Play.
          if ! N=$(tools/release-number.sh "$BASE" "$(git rev-parse HEAD)" 2>"$RUNNER_TEMP/number.err"); then
            cat "$RUNNER_TEMP/number.err" >&2
            [ "$SIGNED" != "true" ] || exit 1
            echo "::warning::No release number for this commit: the dry-run bundle is version $BASE-dev."
            exit 0
          fi
          case "$N" in
            ''|*[!0-9]*) echo "::error::No release number for this commit (got '$N')."; exit 1 ;;
          esac
          echo "Version $BASE.$N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Build release AAB
        env:
          GEODE_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          GEODE_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && secrets.MUZVIZ_UPLOAD_STORE_PASSWORD || '' }}
          GEODE_KEY_ALIAS: ${{ steps.keystore.outputs.signed == 'true' && secrets.MUZVIZ_UPLOAD_KEY_ALIAS || '' }}
          GEODE_KEY_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && secrets.MUZVIZ_UPLOAD_KEY_PASSWORD || '' }}
          PLAY_LICENSE_KEY: ${{ vars.PLAY_LICENSE_KEY }}
          N: ${{ steps.number.outputs.n }}
        run: |
          set -euo pipefail
          # Empty values must read as unset, or the build tries to sign with "".
          for v in GEODE_KEYSTORE GEODE_KEYSTORE_PASSWORD GEODE_KEY_ALIAS GEODE_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          ./gradlew :app:bundleRelease ${N:+-PreleaseNumber=$N} --stacktrace --no-daemon

      - name: Check the bundle against Play and the app's promises
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::$aab was not produced"; exit 1; }
          ls -l "$aab"

          # The manifest promises build-lint.yml checks on every pull request, and the permission list.
          tools/check-manifest.sh release

          # R8 full mode is AGP's default; it is only off if gradle.properties turns it off.
          if grep -Eq '^\s*android\.enableR8\.fullMode\s*=\s*false' gradle.properties; then
            echo "::error::R8 full mode is disabled in gradle.properties"; exit 1
          fi
          test -s app/build/outputs/mapping/release/mapping.txt \
            || { echo "::error::No R8 mapping: the release build was not minified"; exit 1; }
          grep -Eq 'isShrinkResources\s*=\s*true' app/build.gradle.kts \
            || { echo "::error::Resource shrinking is off for release"; exit 1; }

          # What Play reads from the bundle beside the code: the baseline profile it installs with
          # the app, and libgeode.so's symbols for both ABIs, which name the frames of native
          # crashes and ANRs in Play Console.
          entries=$(unzip -Z1 "$aab")
          for entry in \
            BUNDLE-METADATA/com.android.tools.build.profiles/baseline.prof \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/arm64-v8a/libgeode.so.sym \
            BUNDLE-METADATA/com.android.tools.build.debugsymbols/x86_64/libgeode.so.sym; do
            grep -qxF "$entry" <<<"$entries" || { echo "::error::The bundle lacks $entry"; exit 1; }
          done
          echo "Baseline profile and native symbols: present"

          if [ "$SIGNED" = "true" ]; then
            # jarsigner exits 0 on an UNSIGNED jar ("jar is unsigned"), so the verdict is read
            # from its output, not its exit code.
            verdict=$(jarsigner -verify "$aab" 2>&1 || true)
            echo "$verdict" | tail -n 3
            echo "$verdict" | grep -q '^jar verified'               || { echo "::error::$aab is not signed with the upload key"; exit 1; }
            echo "Signed with the upload key."
          else
            echo "::warning::Unsigned dry-run bundle: do not upload it to Play."
          fi

      - name: Upload AAB, R8 mapping and native symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beatrealms-3d-release-${{ github.run_number }}
          # Upload mapping.txt to Play Console with the bundle, or crash traces
          # stay obfuscated. Native debug symbols are embedded in the AAB.
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
