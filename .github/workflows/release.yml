name: Play release bundle

# Builds the Android App Bundle (.aab) that goes to Play Console, and checks the
# things Play and the app's own promises depend on before anyone uploads it.
#
# Runs only on request (Actions > Play release bundle > Run workflow): pull requests and
# tags don't build it. It signs with the upload key; without the key it builds UNSIGNED
# with a warning. The manifest promise checks (INTERNET only with Cast, no AD_ID, targetSdk) also run
# on every PR in build-lint.yml (tools/check-manifest.sh), against the debug build.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   MUZVIZ_UPLOAD_KEYSTORE_BASE64   base64 of the upload keystore (.jks):
#                                   base64 -w0 muzviz-upload.jks
#   MUZVIZ_UPLOAD_STORE_PASSWORD    the keystore password
#   MUZVIZ_UPLOAD_KEY_ALIAS         the key alias inside it
#   MUZVIZ_UPLOAD_KEY_PASSWORD      the key password
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   PLAY_LICENSE_KEY   Play Console > Monetize with Play > Monetization setup >
#                      Licensing: the Base64 RSA public key. Public, not a secret;
#                      the app checks purchase signatures with it.
#
# docs/play/CONSOLE_CHECKLIST.md walks through creating all of these.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # NDK and CMake match ndkVersion and externalNativeBuild.cmake.version in
      # app/build.gradle.kts; bundleRelease compiles the native core with them.
      - name: Install Android SDK 36, NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      # Only a manual run on the repository's own branches reaches this, so the upload key is
      # never readable by pull request code. A missing key builds unsigned with a warning.
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUZVIZ_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUZVIZ_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUZVIZ_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUZVIZ_UPLOAD_KEY_PASSWORD }}
          LICENSE_KEY: ${{ vars.PLAY_LICENSE_KEY }}
        run: |
          set -euo pipefail
          # A key that is set must be a Base64 X.509 RSA public key (billing/PurchaseVerifier.kt
          # refuses every purchase otherwise), signed bundle or not.
          if [ -n "${LICENSE_KEY:-}" ] && ! echo "$LICENSE_KEY" | base64 -d | openssl rsa -pubin -inform DER -noout 2>/dev/null; then
            echo "::error::PLAY_LICENSE_KEY (repository variable) is not a Base64 X.509 RSA public key."
            exit 1
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            [ -n "${LICENSE_KEY:-}" ] || echo "::warning::PLAY_LICENSE_KEY (repository variable) is not set either."
            echo "::warning::Upload key secrets incomplete: building an UNSIGNED bundle. See docs/play/CONSOLE_CHECKLIST.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A signed bundle can go to Play, and without the licence key it would refuse every purchase
          # (billing/PurchaseVerifier.kt), so signing requires it.
          if [ -z "${LICENSE_KEY:-}" ]; then
            echo "::error::PLAY_LICENSE_KEY (repository variable) is not set; a signed store build must verify purchase signatures."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # app/build.gradle.kts reads the GEODE_* names; all four are required to sign.
      # Same version rule as the pre-releases (root build.gradle.kts): the AAB carries the
      # number this commit shipped as (tag apk-v<base>.N), so it matches that pre-release.
      - name: Release number
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^geode\.versionBase=//p' gradle.properties | tr -d '\r')
          N=$(tools/release-number.sh "$BASE" "$(git rev-parse HEAD)")
          echo "Version $BASE.$N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Build release AAB
        env:
          GEODE_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          GEODE_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && secrets.MUZVIZ_UPLOAD_STORE_PASSWORD || '' }}
          GEODE_KEY_ALIAS: ${{ steps.keystore.outputs.signed == 'true' && secrets.MUZVIZ_UPLOAD_KEY_ALIAS || '' }}
          GEODE_KEY_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && secrets.MUZVIZ_UPLOAD_KEY_PASSWORD || '' }}
          PLAY_LICENSE_KEY: ${{ vars.PLAY_LICENSE_KEY }}
        run: |
          set -euo pipefail
          # Empty values must read as unset, or the build tries to sign with "".
          for v in GEODE_KEYSTORE GEODE_KEYSTORE_PASSWORD GEODE_KEY_ALIAS GEODE_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          ./gradlew :app:bundleRelease -PreleaseNumber=${{ steps.number.outputs.n }} --stacktrace --no-daemon

      - name: Check the bundle against Play and the app's promises
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::$aab was not produced"; exit 1; }
          ls -l "$aab"

          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml \
            -path '*merged_manifest*' | head -n 1)
          test -n "$manifest" || { echo "::error::merged release manifest not found"; exit 1; }
          echo "Merged manifest: $manifest"

          # The privacy policy and Data safety answers say Cast to TV is the only internet use.
          if grep -q 'android.permission.INTERNET"' "$manifest" && ! grep -q 'dev.geode.cast.CastService' "$manifest"; then
            echo "::error::The merged release manifest requests INTERNET without Cast; Cast to TV is the only internet use."
            exit 1
          fi
          # The console's Advertising ID declaration says "not used".
          if grep -q 'com.google.android.gms.permission.AD_ID' "$manifest"; then
            echo "::error::The merged release manifest carries AD_ID; the Advertising ID declaration says it is unused."
            exit 1
          fi
          grep -q 'com.android.vending.BILLING' "$manifest" \
            || { echo "::error::Play Billing's BILLING permission is missing from the merged manifest"; exit 1; }

          # Play's target API requirement (API 36 for new apps and updates since 31 Aug 2026).
          target=$(sed -n 's/.*android:targetSdkVersion="\([0-9]*\)".*/\1/p' "$manifest" | head -n 1)
          echo "targetSdkVersion=$target"
          [ "${target:-0}" -ge 36 ] || { echo "::error::targetSdkVersion $target is below Play's requirement (36)"; exit 1; }

          # R8 full mode is AGP's default; it is only off if gradle.properties turns it off.
          if grep -Eq '^\s*android\.enableR8\.fullMode\s*=\s*false' gradle.properties; then
            echo "::error::R8 full mode is disabled in gradle.properties"; exit 1
          fi
          test -s app/build/outputs/mapping/release/mapping.txt \
            || { echo "::error::No R8 mapping: the release build was not minified"; exit 1; }
          grep -Eq 'isShrinkResources\s*=\s*true' app/build.gradle.kts \
            || { echo "::error::Resource shrinking is off for release"; exit 1; }

          # The baseline profile ships inside the bundle.
          unzip -l "$aab" | grep -q 'BUNDLE-METADATA/com.android.tools.build.profiles/baseline.prof' \
            && echo "Baseline profile: present" \
            || echo "::warning::No baseline profile in the bundle"

          if [ "$SIGNED" = "true" ]; then
            # jarsigner exits 0 on an UNSIGNED jar ("jar is unsigned"), so the verdict is read
            # from its output, not its exit code.
            verdict=$(jarsigner -verify "$aab" 2>&1 || true)
            echo "$verdict" | tail -n 3
            echo "$verdict" | grep -q '^jar verified'               || { echo "::error::$aab is not signed with the upload key"; exit 1; }
            echo "Signed with the upload key."
          else
            echo "::notice::Unsigned bundle (no upload key secrets). Fine for CI; Play needs it signed."
          fi

      - name: Upload AAB, R8 mapping and native symbols
        uses: actions/upload-artifact@v7
        with:
          name: muzviz-release-${{ github.run_number }}
          # Upload mapping.txt to Play Console with the bundle, or crash traces
          # stay obfuscated. Native debug symbols are embedded in the AAB.
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
