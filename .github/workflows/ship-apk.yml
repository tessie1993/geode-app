name: Ship Geode APK

# Builds the debug-signed APK from main and claude/geode-finish and publishes it as a GitHub Release,
# so it can be downloaded and sideloaded without a GitHub login and without the
# 30-day expiry that applies to the workflow artifacts in android.yml.
#
# Releases are marked pre-release: this is Android's debug signing key, not the
# Play upload key. The Play Store build is release.yml.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build and ship
        default: main
        required: true
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: true
  # Every merge into main or the integration branch ships a pre-release,
  # docs-only merges included, so each merged PR has an installable build.
  push:
    branches:
      - main
      - claude/geode-finish

permissions:
  contents: write

# Keyed on the COMMIT, not the branch. `cancel-in-progress: false` only
# protects a run that has already started: GitHub keeps at most one PENDING run
# per group and cancels the older one, so two pushes to main in quick
# succession meant the middle commit was never built or verified at all. That
# is not hypothetical - it is how a commit that does not compile became main
# (the merge that dropped `GlUtil.withChunk` while its call sites survived),
# and it stayed undetected until the NEXT push failed for the same reason.
# One group per commit means every commit on main is verified on its own.
concurrency:
  group: geode-ship-${{ github.sha }}
  cancel-in-progress: false

env:
  PROJECT_DIR: .
  APK_SOURCE: app/build/outputs/apk/debug/app-debug.apk

jobs:
  ship-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A dispatch defaults to main so the APK that ships is main's, even
          # when the run is started from another branch.
          ref: ${{ inputs.ref || github.sha }}
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      # Every release gets its own number, 1.8.1.N. The number is reserved by
      # pushing the tag apk-v1.8.1.N before the build: tag creation is atomic,
      # so two runs racing for the same N cannot both win and the loser takes
      # the next one. A re-run of a commit reuses the tag already on it.
      # FLOOR is the release count when numbering began, so the first is .28.
      - name: Number the release
        id: number
        shell: bash
        env:
          BASE: "1.8.1"
          FLOOR: "27"
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          PREFIX="refs/tags/apk-v$BASE."
          TAGS=$(git ls-remote --tags origin "${PREFIX}*")
          N=$(awk -v sha="$SHA" -v p="$PREFIX" '$1 == sha && index($2, p) == 1 { print substr($2, length(p) + 1) }' <<<"$TAGS" | head -n 1)
          if [ -z "$N" ]; then
            LAST=$({ echo "$FLOOR"; awk -v p="$PREFIX" 'index($2, p) == 1 { print substr($2, length(p) + 1) }' <<<"$TAGS" | grep -E '^[0-9]+$' || true; } | sort -n | tail -n 1)
            N=$((LAST + 1))
            until git push -q origin "$SHA:${PREFIX}$N"; do
              N=$((N + 1))
              [ "$N" -le $((LAST + 20)) ] || { echo "::error::could not reserve a release number"; exit 1; }
            done
          fi
          # versionCode 33 was 1.8.1 before numbering; 1.8.1.28 is 34 and each release adds one.
          {
            echo "ORG_GRADLE_PROJECT_geodeVersionName=$BASE.$N"
            echo "ORG_GRADLE_PROJECT_geodeVersionCode=$((N + 6))"
          } >> "$GITHUB_ENV"
          {
            echo "version_name=$BASE.$N"
            echo "version_code=$((N + 6))"
            echo "tag=apk-v$BASE.$N"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36, NDK and CMake
        shell: bash
        # sdkmanager is not on PATH on the ubuntu-24.04 runner image; resolve
        # it from the preinstalled SDK location instead. NDK and CMake match
        # app/build.gradle.kts and compile the JNI bridge in app/src/main/cpp.
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # Nothing gets published that has not passed the same checks android.yml
      # runs, so a release asset is always a verified build.
      - name: Verify (ktlint, unit tests, lint)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew ktlintCheck :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=${{ steps.number.outputs.version_name }}
          VERSION_CODE=${{ steps.number.outputs.version_code }}
          # The checkout may be a different ref than the one that triggered the
          # run, so tag the commit actually built.
          BUILT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=${BUILT_SHA::7}
          FILE_NAME="MuzViz-${VERSION_NAME}-${SHORT_SHA}-debug.apk"

          mkdir -p dist
          cp "$APK_SOURCE" "dist/$FILE_NAME"
          ( cd dist && sha256sum "$FILE_NAME" > "$FILE_NAME.sha256" )

          {
            echo "file_name=$FILE_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "built_sha=$BUILT_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "tag=${{ steps.number.outputs.tag }}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          FILE_NAME: ${{ steps.package.outputs.file_name }}
          BUILT_SHA: ${{ steps.package.outputs.built_sha }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
          VERSION_CODE: ${{ steps.package.outputs.version_code }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          # Empty on push events, where a pre-release is always what we want.
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Debug-signed Geode APK built by GitHub Actions.

          | | |
          | --- | --- |
          | Version | \`$VERSION_NAME\` (versionCode $VERSION_CODE) |
          | Commit | \`$BUILT_SHA\` |
          | ABI | arm64-v8a and x86_64, minSdk 26 |
          | Workflow run | [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |

          Download \`$FILE_NAME\` and open it on the device to install; Android
          asks for permission to install from the browser or file manager used.
          Verify the download with \`sha256sum -c $FILE_NAME.sha256\`.

          This build is signed with Android's debug key while sharing the
          Play build's application id, so the two cannot be installed at the
          same time: Android refuses the install over a Play copy, and you have
          to uninstall one to try the other.
          EOF
          )

          PRERELEASE_FLAG=()
          if [ "${PRERELEASE:-true}" != "false" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          # Re-running the workflow on the same commit refreshes the assets of
          # the existing release rather than failing on the duplicate tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$FILE_NAME" "dist/$FILE_NAME.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/$FILE_NAME" "dist/$FILE_NAME.sha256" \
              --target "$BUILT_SHA" \
              --title "MuzViz $VERSION_NAME ($SHORT_SHA)" \
              --notes "$NOTES" \
              "${PRERELEASE_FLAG[@]}"
          fi

          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "### Shipped \`${{ steps.package.outputs.file_name }}\`"
            echo
            echo "- Release: ${{ steps.release.outputs.url }}"
            echo "- Commit: \`${{ steps.package.outputs.built_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A failed build gives its number back, so N stays the release count.
      - name: Release the number when the build fails
        if: failure() && steps.number.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.number.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || git push -q origin ":refs/tags/$TAG"

      - name: Upload reports when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: geode-ship-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
