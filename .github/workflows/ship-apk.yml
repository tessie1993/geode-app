name: Ship BeatRealms 3D APK

# Builds the debug-signed APK and publishes it as a GitHub Release, so it can be
# downloaded and sideloaded without a GitHub login and without the 30-day expiry
# that applies to the workflow artifacts in android.yml.
#
# It runs at the end of every green android.yml run on a push (its "Ship
# pre-release" job calls this workflow), so a pre-release only ever ships a
# commit that passed build, lint, unit and emulator tests. Pushes to main, which
# android.yml does not run on, still ship directly, as does a manual dispatch.
#
# Releases are marked pre-release: this is Android's debug signing key, not the
# Play upload key. The Play Store build is release.yml.
#
# Pre-release N (the Nth GitHub release) is "BeatRealms 3D <base>.N", tag apk-v<base>.N,
# versionName <base>.N; see the "Reserve release number" step.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build and ship
        default: main
        required: true
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: true
  # android.yml's last job, once everything before it is green.
  workflow_call:
    inputs:
      ref:
        description: The commit the green run tested
        type: string
        required: true
      prerelease:
        type: boolean
        default: true
  # Every merge into main ships a pre-release, docs-only merges included, so
  # each merged PR has an installable build.
  push:
    branches:
      - main

permissions:
  contents: write

# Keyed on the COMMIT, not the branch. `cancel-in-progress: false` only
# protects a run that has already started: GitHub keeps at most one PENDING run
# per group and cancels the older one, so two pushes to main in quick
# succession meant the middle commit was never built or verified at all. That
# is not hypothetical - it is how a commit that does not compile became main
# (the merge that dropped `GlUtil.withChunk` while its call sites survived),
# and it stayed undetected until the NEXT push failed for the same reason.
# One group per commit means every commit on main is verified on its own.
concurrency:
  group: geode-ship-${{ github.sha }}
  cancel-in-progress: false

env:
  PROJECT_DIR: .
  APK_SOURCE: app/build/outputs/apk/debug/app-debug.apk

jobs:
  # A push to main publishes only if the native host tests pass; a run called from
  # android.yml (or by hand) already passed them, so it skips this.
  host-tests:
    name: Native host tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/native-host-tests.yml

  ship-apk:
    name: Build and publish APK
    needs: host-tests
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch defaults to main so the APK that ships is main's, even
          # when the run is started from another branch. A call from android.yml
          # passes the commit its green run tested.
          ref: ${{ inputs.ref || github.sha }}
          # third_party/* are submodules; the root CMakeLists.txt builds them.
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK 36, NDK and CMake
        shell: bash
        # sdkmanager is not on PATH on the ubuntu-24.04 runner image; resolve
        # it from the preinstalled SDK location instead. NDK and CMake match
        # app/build.gradle.kts and compile the JNI bridge in app/src/main/cpp.
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location not set on runner}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      # Before the number is reserved, so a red test burns no release. On a push to main only;
      # android.yml has already run them for the other callers.
      - name: Run unit tests
        if: github.event_name == 'push'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:testDebugUnitTest :engine:audio-core:test :engine:scenes:testDebugUnitTest --stacktrace --no-daemon

      # Each pre-release gets its own number N (versionName <base>.N, tag apk-v<base>.N):
      # releases so far + 1, reserved by pushing the tag first so concurrent runs never
      # share one. The base lives in gradle.properties; the rule in the root build.gradle.kts.
      - name: Reserve release number
        id: number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^geode\.versionBase=//p' gradle.properties | tr -d '\r')
          N=$(tools/release-number.sh "$BASE" "$(git rev-parse HEAD)" reserve)
          echo "Release number $N (version $BASE.$N)"
          { echo "n=$N"; echo "base=$BASE"; } >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug -PreleaseNumber=${{ steps.number.outputs.n }} --stacktrace --no-daemon

      - name: Package APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Read the version from the APK itself, and refuse to publish one whose
          # name is not the reserved release number.
          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          BADGING=$("$AAPT2" dump badging "$APK_SOURCE")
          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$BADGING")
          EXPECTED="${{ steps.number.outputs.base }}.${{ steps.number.outputs.n }}"
          if [ "$VERSION_NAME" != "$EXPECTED" ]; then
            echo "::error::APK versionName is '$VERSION_NAME', expected '$EXPECTED'"
            exit 1
          fi
          # The checkout may be a different ref than the one that triggered the
          # run, so tag the commit actually built.
          BUILT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=${BUILT_SHA::7}
          FILE_NAME="BeatRealms3D-${VERSION_NAME}-debug.apk"

          mkdir -p dist
          cp "$APK_SOURCE" "dist/$FILE_NAME"
          ( cd dist && sha256sum "$FILE_NAME" > "$FILE_NAME.sha256" )

          {
            echo "file_name=$FILE_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "built_sha=$BUILT_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "tag=apk-v$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          FILE_NAME: ${{ steps.package.outputs.file_name }}
          BUILT_SHA: ${{ steps.package.outputs.built_sha }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
          VERSION_CODE: ${{ steps.package.outputs.version_code }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          # Empty on push events, where a pre-release is always what we want;
          # a call from android.yml passes true.
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Debug-signed BeatRealms 3D APK built by GitHub Actions.

          | | |
          | --- | --- |
          | Version | \`$VERSION_NAME\` (versionCode $VERSION_CODE) |
          | Commit | \`$BUILT_SHA\` |
          | ABI | arm64-v8a and x86_64, minSdk 33 (Android 13) |
          | Workflow run | [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |

          Download \`$FILE_NAME\` and open it on the device to install; Android
          asks for permission to install from the browser or file manager used.
          Verify the download with \`sha256sum -c $FILE_NAME.sha256\`.

          This build is signed with Android's debug key while sharing the
          Play build's application id, so the two cannot be installed at the
          same time: Android refuses the install over a Play copy, and you have
          to uninstall one to try the other.
          EOF
          )

          PRERELEASE_FLAG=()
          if [ "${PRERELEASE:-true}" != "false" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          # The tag already exists (reserved above). Re-running the workflow on
          # the same commit refreshes the assets of its release instead.
          # A new release starts as a draft and is published only once both
          # assets are up: a newer push can cancel this run mid-upload (android.yml
          # cancels superseded runs), and a cancelled draft is deleted below
          # instead of staying public without its APK.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$FILE_NAME" "dist/$FILE_NAME.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/$FILE_NAME" "dist/$FILE_NAME.sha256" \
              --draft \
              --target "$BUILT_SHA" \
              --title "BeatRealms 3D $VERSION_NAME" \
              --notes "$NOTES" \
              "${PRERELEASE_FLAG[@]}"
          fi
          gh release edit "$TAG" --draft=false

          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "### Shipped \`${{ steps.package.outputs.file_name }}\`"
            echo
            echo "- Release: ${{ steps.release.outputs.url }}"
            echo "- Commit: \`${{ steps.package.outputs.built_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A run that failed or was cancelled before publishing hands its number
      # back, so the next release takes it, and deletes the draft it left if it
      # stopped mid-upload. A published release (a re-run that failed later) is
      # never touched.
      - name: Release the reserved number
        if: (failure() || cancelled()) && steps.number.outputs.n != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-v${{ steps.number.outputs.base }}.${{ steps.number.outputs.n }}
        run: |
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = false ]; then
            echo "$TAG has a published release; keeping it."
          elif [ "$DRAFT" = true ]; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          else
            git push origin --delete "refs/tags/$TAG" || true
          fi

      - name: Upload reports when the build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geode-ship-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
