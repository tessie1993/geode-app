name: tmp golden
on:
  push:
    branches: [agents/sample-hop]
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          g++ -std=c++20 -O1 -Icore core/tests/sound_golden_test.cpp core/sound/*.cpp -o g
          ./g --write out.txt
          echo BEGIN_GOLDEN
          cat out.txt
          echo END_GOLDEN
