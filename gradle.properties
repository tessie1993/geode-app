org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true


# Release versioning: the one place the version is set. The root build.gradle.kts turns these
# into versionName <base>.<N> and versionCode <codeBase + N>, where N is the release number CI
# passes as -PreleaseNumber=N (tools/release-number.sh). Builds without N are <base>-dev.
geode.versionBase=1.8.1
geode.versionCodeBase=33
