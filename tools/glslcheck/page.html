<!doctype html>
<meta charset="utf-8">
<canvas id="c"></canvas>
<script>
// The GL half of glslcheck. One context, one fullscreen triangle, one draw per
// job. Nothing here knows what a style is; check.mjs hands it a vertex source,
// a fragment source and a fully planned uniform list.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
if (!gl) throw new Error('no webgl2 context');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error(`compile: ${log}`);
  }
  return s;
}

function link(vertSrc, fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error(`link: ${log}`);
  }
  return p;
}

// Stand-in textures. Each is named for what the app binds there so a report
// line can say which one it was.
const textures = {};
function makeTexture(name, w, h, fill) {
  const data = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) fill(x, y, data.subarray((y * w + x) * 4, (y * w + x) * 4 + 4));
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  textures[name] = t;
}
// uSoundTex as SoundUniforms lays it out, 128 x 3: row 0 the spectrum (falling),
// row 1 the waveform, row 2 the EQ bands. R32F in the app; RGBA8 here, so the
// waveform reads 0.15..0.85 instead of -1..1 and the EQ is capped at 1. That
// changes the range the style reads, not whether it reads anything.
makeTexture('sound', 128, 3, (x, y, px) => {
  const v = y === 0 ? Math.max(0, 0.9 - x / 128) : y === 1 ? 0.5 + 0.35 * Math.sin(x * 0.44) : 0.8;
  px[0] = px[1] = px[2] = Math.round(v * 255); px[3] = 255;
});
makeTexture('palette', 256, 1, (x, y, px) => {
  const t = x / 256;
  px[0] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * t)));
  px[1] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * (t + 0.33))));
  px[2] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * (t + 0.67))));
  px[3] = 255;
});
makeTexture('white', 2, 2, (x, y, px) => { px[0] = px[1] = px[2] = px[3] = 255; });
// lib_generator's four slots (gen0 sky .. gen3 plane): black until a --gen job draws style B there.
for (let i = 0; i < 4; i++) makeTexture(`gen${i}`, 2, 2, (x, y, px) => { px[0] = px[1] = px[2] = 0; px[3] = 255; });
const genStandIns = [0, 1, 2, 3].map((i) => textures[`gen${i}`]);
makeTexture('noise', 64, 64, (x, y, px) => { const v = Math.floor(Math.random() * 256); px[0] = px[1] = px[2] = v; px[3] = 255; });
// A dye field with structure: two soft coloured blobs and a filament, so a
// look that reads gradients, luminance or hue has something to chew on.
makeTexture('dye', 128, 128, (x, y, px) => {
  const u = x / 128 - 0.5, v = y / 128 - 0.5;
  const a = Math.exp(-((u + 0.15) ** 2 + (v - 0.1) ** 2) * 30);
  const b = Math.exp(-((u - 0.2) ** 2 + (v + 0.15) ** 2) * 40);
  const f = Math.exp(-((v - 0.3 * Math.sin(u * 9)) ** 2) * 400) * 0.6;
  px[0] = Math.min(255, Math.round(255 * (a * 0.9 + f * 0.8)));
  px[1] = Math.min(255, Math.round(255 * (a * 0.2 + b * 0.8 + f * 0.3)));
  px[2] = Math.min(255, Math.round(255 * (b * 0.9 + f * 0.9)));
  px[3] = 255;
});

// The app's FullscreenTriangle (core/viz/Quad.cpp): three vertices at
// location 0. quad_vert.glsl builds its triangle from gl_VertexID and needs
// no buffer; fluid_base_vert.glsl reads aPosition and does.
const triangle = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

function upload(program, u) {
  const loc = gl.getUniformLocation(program, u.name);
  if (loc === null) return false;
  if (u.texture) {
    gl.activeTexture(gl.TEXTURE0 + u.unit);
    gl.bindTexture(gl.TEXTURE_2D, textures[u.texture]);
    gl.uniform1i(loc, u.unit);
    return true;
  }
  const v = Array.isArray(u.value) ? u.value : [u.value];
  // An array uniform takes a full list when given one (the bloom pass's per-bloom values), else one
  // value repeated.
  switch (u.type) {
    case 'float': gl.uniform1fv(loc, u.count > 1 && v.length !== u.count ? new Float32Array(u.count).fill(v[0]) : v); break;
    case 'int': gl.uniform1iv(loc, u.count > 1 && v.length !== u.count ? new Int32Array(u.count).fill(v[0]) : v); break;
    case 'vec2': gl.uniform2fv(loc, v); break;
    case 'vec3': gl.uniform3fv(loc, v); break;
    case 'mat3': gl.uniformMatrix3fv(loc, false, v); break;
    case 'vec4': {
      // Either one vec4 repeated across the array, or every element given (uSound).
      const arr = new Float32Array(u.count * 4);
      if (v.length === u.count * 4) arr.set(v);
      else for (let i = 0; i < u.count; i++) arr.set(v, i * 4);
      gl.uniform4fv(loc, arr);
      break;
    }
    default: throw new Error(`unhandled uniform type ${u.type} for ${u.name}`);
  }
  return true;
}

window.__render = async function (job) {
  const out = { dropped: [] };
  let program = null;
  try {
    canvas.width = job.width;
    canvas.height = job.height;
    drawGenerators(job.gens || [], out);
    program = link(job.vert, job.frag);
    gl.useProgram(program);
    let unit = 0;
    for (const u of job.uniforms) {
      if (u.texture) u.unit = unit++;
      if (!upload(program, u)) out.dropped.push(u.name);
    }
    if (job.vert.includes('aPosition')) {
      gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(0);
    }
    gl.viewport(0, 0, job.width, job.height);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (job.overlay) {
      // A second pass over the first, blended the way the app blends it (the note blooms: screen,
      // ONE / ONE_MINUS_SRC_COLOR, as NoteBloomPass does).
      gl.deleteProgram(program);
      program = link(job.overlay.vert, job.overlay.frag);
      gl.useProgram(program);
      for (const u of job.overlay.uniforms) {
        if (!upload(program, u)) out.dropped.push(u.name);
      }
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.disable(gl.BLEND);
    }
    gl.finish();
    const err = gl.getError();
    out.glError = err === gl.NO_ERROR ? 0 : err;
    const px = new Uint8Array(job.width * job.height * 4);
    gl.readPixels(0, 0, job.width, job.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sum = 0, max = 0, black = 0, blown = 0;
    const n = job.width * job.height;
    for (let i = 0; i < n; i++) {
      const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      sum += l;
      if (l > max) max = l;
      if (l < 0.02) black++;
      if (r > 0.95 && g > 0.95 && b > 0.95) blown++;
    }
    out.meanLuma = sum / n;
    out.maxLuma = max;
    out.fracBlack = black / n;
    out.fracBlown = blown / n;
    out.png = canvas.toDataURL('image/png').split(',')[1];
  } catch (e) {
    out.error = String(e.message || e).replace(/\n/g, ' | ');
  } finally {
    if (program) gl.deleteProgram(program);
    releaseGenerators();
  }
  return out;
};

// Generators (#471, check.mjs --gen): each style B drawn once into its own RGBA8 target at its own
// size (target()/fbo() below, as the Liquid born path does), then put in place of its slot's stand-in
// so the job's lib_generator sampler reads it. Back to the default framebuffer afterwards.
const genTargets = [];
function drawGenerators(gens, out) {
  for (const g of gens) {
    const tex = target(g.width, g.height, false);
    const f = fbo([tex]);
    const p = link(g.vert, g.frag);
    gl.useProgram(p);
    let unit = 0;
    for (const u of g.uniforms) {
      if (u.texture) u.unit = unit++;
      if (!upload(p, u)) out.dropped.push(`${g.name}.${u.name}`);
    }
    gl.disableVertexAttribArray(0);
    gl.viewport(0, 0, g.width, g.height);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.deleteProgram(p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(f);
    textures[`gen${g.slot}`] = tex;
    genTargets.push(tex);
  }
}
function releaseGenerators() {
  for (const t of genTargets) gl.deleteTexture(t);
  genTargets.length = 0;
  genStandIns.forEach((t, i) => { textures[`gen${i}`] = t; });
}

// ---- Liquid mode: many frames of feedback (check.mjs --liquid) -------------
//
// The same frame graph as Renderer::render with Liquid on: the style draws into its own target, the
// born look into another, then liquid_frag.glsl reads the liquid's last frame and writes the next
// one plus what the screen shows (two targets). The flow field is a stand-in: a few drifting vortices
// on a 32 x 32 grid, uploaded every frame, in FluidSim's units (cells per second). The dive, the born
// clock and the pour-back weights come from check.mjs, which mirrors LiquidMath.
function target(w, h, half) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  if (half) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(texs) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  return f;
}
function bindUniforms(program, list, extraTextures) {
  let unit = 0;
  for (const u of list) {
    if (u.texture) {
      u.unit = unit++;
      const loc = gl.getUniformLocation(program, u.name);
      if (loc === null) continue;
      gl.activeTexture(gl.TEXTURE0 + u.unit);
      gl.bindTexture(gl.TEXTURE_2D, extraTextures[u.texture] || textures[u.texture]);
      gl.uniform1i(loc, u.unit);
    } else {
      upload(program, u);
    }
  }
}
function velocityField(t, n) {
  const data = new Float32Array(n * n * 4);
  const vortices = [
    [0.5 + 0.25 * Math.cos(t * 0.31), 0.5 + 0.2 * Math.sin(t * 0.43), 60],
    [0.5 + 0.3 * Math.cos(t * 0.23 + 2), 0.5 + 0.25 * Math.sin(t * 0.37 + 1), -45],
    [0.5 + 0.2 * Math.cos(t * 0.5 + 4), 0.5 + 0.3 * Math.sin(t * 0.29 + 3), 35],
  ];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let vx = 0, vy = 0;
    const u = (x + 0.5) / n, v = (y + 0.5) / n;
    for (const [cx, cy, k] of vortices) {
      const dx = u - cx, dy = v - cy, r2 = dx * dx + dy * dy + 0.004;
      const f = k * Math.exp(-r2 * 18) ;
      vx += -dy * f; vy += dx * f;
    }
    data[(y * n + x) * 4] = vx; data[(y * n + x) * 4 + 1] = vy;
  }
  return data;
}
window.__liquid = async function (job) {
  const out = { dropped: [], frames: [] };
  const progs = [];
  try {
    const W = job.width, H = job.height;
    canvas.width = W; canvas.height = H;
    const half = !!gl.getExtension('EXT_color_buffer_float');
    out.half = half;
    const styleProg = link(job.styleVert, job.styleFrag); progs.push(styleProg);
    const bornProg = link(job.styleVert, job.bornFrag); progs.push(bornProg);
    const liquidProg = link(job.liquidVert, job.liquidFrag); progs.push(liquidProg);
    const styleTex = target(W, H, false), bornTex = target(W, H, false);
    const styleFbo = fbo([styleTex]), bornFbo = fbo([bornTex]);
    const liq = [target(W, H, half), target(W, H, half)];
    const disp = [target(W, H, false), target(W, H, false)];
    const liqFbo = [fbo([liq[0], disp[0]]), fbo([liq[1], disp[1]])];
    for (const f of liqFbo) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
    const N = 32;
    const vel = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, vel);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.disableVertexAttribArray(0);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);
    let read = 0;
    for (let i = 0; i < job.frames.length; i++) {
      const fr = job.frames[i];
      gl.bindTexture(gl.TEXTURE_2D, vel);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, N, N, 0, gl.RGBA, gl.FLOAT, velocityField(fr.time, N));
      gl.bindFramebuffer(gl.FRAMEBUFFER, styleFbo);
      gl.useProgram(styleProg);
      bindUniforms(styleProg, fr.style, {});
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (job.bornSeparate) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, bornFbo);
        gl.useProgram(bornProg);
        bindUniforms(bornProg, fr.born, {});
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      const write = 1 - read;
      gl.bindFramebuffer(gl.FRAMEBUFFER, liqFbo[write]);
      gl.useProgram(liquidProg);
      bindUniforms(liquidProg, fr.liquid, { prev: liq[read], style: styleTex, born: job.bornSeparate ? bornTex : styleTex, vel });
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      read = write;
      if (fr.snap) {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, liqFbo[read]);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.finish();
        out.frames.push({ index: i, png: canvas.toDataURL('image/png').split(',')[1] });
      }
    }
    const err = gl.getError();
    out.glError = err === gl.NO_ERROR ? 0 : err;
  } catch (e) {
    out.error = String(e.message || e).replace(/\n/g, ' | ');
  } finally {
    for (const p of progs) gl.deleteProgram(p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  return out;
};
window.__harnessReady = true;
</script>
