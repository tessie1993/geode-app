<!doctype html>
<meta charset="utf-8">
<canvas id="c"></canvas>
<script>
// The GL half of glslcheck. One context, one fullscreen triangle, one draw per
// job. Nothing here knows what a style is; check.mjs hands it a vertex source,
// a fragment source and a fully planned uniform list.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
if (!gl) throw new Error('no webgl2 context');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error(`compile: ${log}`);
  }
  return s;
}

function link(vertSrc, fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p);
    gl.deleteProgram(p);
    throw new Error(`link: ${log}`);
  }
  return p;
}

// Stand-in textures. Each is named for what the app binds there so a report
// line can say which one it was.
const textures = {};
function makeTexture(name, w, h, fill) {
  const data = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) fill(x, y, data.subarray((y * w + x) * 4, (y * w + x) * 4 + 4));
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  textures[name] = t;
}
// Row 0.25 = bands (a falling spectrum), row 0.75 = a waveform. R32F in the
// app; RGBA8 here, which only changes the range the style reads, not whether
// it reads anything.
makeTexture('audio', 512, 2, (x, y, px) => {
  const v = y === 0 ? Math.max(0, 0.9 - x / 512) : 0.5 + 0.35 * Math.sin(x * 0.11);
  px[0] = px[1] = px[2] = Math.round(v * 255); px[3] = 255;
});
makeTexture('palette', 256, 1, (x, y, px) => {
  const t = x / 256;
  px[0] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * t)));
  px[1] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * (t + 0.33))));
  px[2] = Math.round(255 * (0.5 + 0.5 * Math.cos(6.2831 * (t + 0.67))));
  px[3] = 255;
});
makeTexture('flow', 2, 2, (x, y, px) => { px[0] = px[1] = 128; px[2] = 0; px[3] = 255; });
makeTexture('white', 2, 2, (x, y, px) => { px[0] = px[1] = px[2] = px[3] = 255; });
makeTexture('noise', 64, 64, (x, y, px) => { const v = Math.floor(Math.random() * 256); px[0] = px[1] = px[2] = v; px[3] = 255; });
// A dye field with structure: two soft coloured blobs and a filament, so a
// look that reads gradients, luminance or hue has something to chew on.
makeTexture('dye', 128, 128, (x, y, px) => {
  const u = x / 128 - 0.5, v = y / 128 - 0.5;
  const a = Math.exp(-((u + 0.15) ** 2 + (v - 0.1) ** 2) * 30);
  const b = Math.exp(-((u - 0.2) ** 2 + (v + 0.15) ** 2) * 40);
  const f = Math.exp(-((v - 0.3 * Math.sin(u * 9)) ** 2) * 400) * 0.6;
  px[0] = Math.min(255, Math.round(255 * (a * 0.9 + f * 0.8)));
  px[1] = Math.min(255, Math.round(255 * (a * 0.2 + b * 0.8 + f * 0.3)));
  px[2] = Math.min(255, Math.round(255 * (b * 0.9 + f * 0.9)));
  px[3] = 255;
});

// The app's FullscreenTriangle (core/viz/Quad.cpp): three vertices at
// location 0. quad_vert.glsl builds its triangle from gl_VertexID and needs
// no buffer; fluid_base_vert.glsl reads aPosition and does.
const triangle = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

function upload(program, u) {
  const loc = gl.getUniformLocation(program, u.name);
  if (loc === null) return false;
  if (u.texture) {
    gl.activeTexture(gl.TEXTURE0 + u.unit);
    gl.bindTexture(gl.TEXTURE_2D, textures[u.texture]);
    gl.uniform1i(loc, u.unit);
    return true;
  }
  const v = Array.isArray(u.value) ? u.value : [u.value];
  switch (u.type) {
    case 'float': gl.uniform1fv(loc, u.count > 1 ? new Float32Array(u.count).fill(v[0]) : v); break;
    case 'int': gl.uniform1iv(loc, u.count > 1 ? new Int32Array(u.count).fill(v[0]) : v); break;
    case 'vec2': gl.uniform2fv(loc, v); break;
    case 'vec3': gl.uniform3fv(loc, v); break;
    case 'vec4': {
      const arr = new Float32Array(u.count * 4);
      for (let i = 0; i < u.count; i++) arr.set(v, i * 4);
      gl.uniform4fv(loc, arr);
      break;
    }
    default: throw new Error(`unhandled uniform type ${u.type} for ${u.name}`);
  }
  return true;
}

window.__render = async function (job) {
  const out = { dropped: [] };
  let program = null;
  try {
    canvas.width = job.width;
    canvas.height = job.height;
    program = link(job.vert, job.frag);
    gl.useProgram(program);
    let unit = 0;
    for (const u of job.uniforms) {
      if (u.texture) u.unit = unit++;
      if (!upload(program, u)) out.dropped.push(u.name);
    }
    if (job.vert.includes('aPosition')) {
      gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } else {
      gl.disableVertexAttribArray(0);
    }
    gl.viewport(0, 0, job.width, job.height);
    gl.disable(gl.BLEND);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    const err = gl.getError();
    out.glError = err === gl.NO_ERROR ? 0 : err;
    const px = new Uint8Array(job.width * job.height * 4);
    gl.readPixels(0, 0, job.width, job.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let sum = 0, max = 0, black = 0, blown = 0;
    const n = job.width * job.height;
    for (let i = 0; i < n; i++) {
      const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      sum += l;
      if (l > max) max = l;
      if (l < 0.02) black++;
      if (r > 0.95 && g > 0.95 && b > 0.95) blown++;
    }
    out.meanLuma = sum / n;
    out.maxLuma = max;
    out.fracBlack = black / n;
    out.fracBlown = blown / n;
    out.png = canvas.toDataURL('image/png').split(',')[1];
  } catch (e) {
    out.error = String(e.message || e).replace(/\n/g, ' | ');
  } finally {
    if (program) gl.deleteProgram(program);
  }
  return out;
};
window.__harnessReady = true;
</script>
